# deploy/prometheus/prometheus.dev.yml — local scrape configuration.
#
# Static targets rather than service discovery: the local stack's membership is fixed by
# the compose file, and a discovery mechanism that does not exist in production (there it
# is the Prometheus agent with kubernetes_sd) would be a third configuration to maintain
# and would teach nobody anything.

global:
  scrape_interval: 5s        # 15s in production; faster here so a change is visible
  evaluation_interval: 15s
  external_labels:
    environment: development
    region: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    honor_labels: true

  # The platform services. Every one exposes /metrics from the telemetry registry
  # (internal/infrastructure/telemetry), which is the single place a pp_* metric may be
  # declared — see scripts/check-metrics-cardinality.sh.
  - job_name: pp-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "payment-api:8080"
          - "payment-orchestrator:8081"
          - "control-plane-api:8082"
          - "webhook-ingress:8083"
          - "workflow-worker:8084"
          - "outbox-relay:8085"
          - "event-consumer:8086"
          - "gateway-simulator:8090"
        labels:
          environment: development
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"
