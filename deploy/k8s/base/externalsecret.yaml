# Requires the External Secrets Operator (https://external-secrets.io) installed cluster-wide.
# Syncs values from AWS Secrets Manager into a Kubernetes Secret at deploy time and on a refresh
# interval — the application still reads short-TTL credentials at runtime rather than trusting a
# single injected snapshot for the pod's whole lifetime (docs/05-security-architecture.md,
# "Secrets management").
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-api-secrets
  namespace: payments
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: payments-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_DSN
      remoteRef:
        key: prod/payments-api/database-dsn
    - secretKey: JWKS_URL
      remoteRef:
        key: prod/payments-api/jwks-url
    - secretKey: JWT_AUDIENCE
      remoteRef:
        key: prod/payments-api/jwt-audience
    - secretKey: JWT_ISSUER
      remoteRef:
        key: prod/payments-api/jwt-issuer
    - secretKey: PAYMENT_EVENTS_QUEUE_URL
      remoteRef:
        key: prod/payments-api/payment-events-queue-url
