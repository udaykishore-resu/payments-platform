apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels:
    app: payments-api
spec:
  # Baseline replica count; HorizontalPodAutoscaler (hpa.yaml) manages the real value in
  # production between minReplicas and maxReplicas. This is only the initial/rollback value.
  replicas: 6
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable=0 combined with the PodDisruptionBudget guarantees the deploy never dips
      # below serving capacity — this IS the zero-downtime-deployment requirement, implemented
      # with a standard, well-understood Kubernetes primitive rather than bespoke tooling.
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payments-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across AZs so a single AZ failure can never take out more than roughly
      # 1/3 of capacity — the scheduling half of the AZ-failure recovery story in
      # docs/04-failure-recovery-design.md (the other half is the PodDisruptionBudget below).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: payments-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: payments-api
      # Gives the pod time to drain in-flight requests and let the Service/LB stop routing new
      # traffic to it before SIGTERM is delivered to the process — see
      # cmd/server/main.go's graceful shutdown handling and docs/04-failure-recovery-design.md.
      terminationGracePeriodSeconds: 35
      containers:
        - name: payments-api
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/payments-api:REPLACED_BY_CI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: payments-api-config
            - secretRef:
                name: payments-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Resource requests/limits sized from load-test data (docs/07-reliability-slo.md), not
          # guessed. requests == limits for CPU would over-constrain bursty request handling;
          # instead we set a generous limit and let HPA react to sustained pressure rather than
          # throttling individual requests.
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          # Liveness deliberately does NOT check DB connectivity (see internal/api/health.go and
          # docs/06-observability.md) — a DB blip should not cause Kubernetes to kill and
          # reschedule an otherwise-healthy process.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness checks DB reachability; a pod that can't reach its dependencies is taken
          # out of the Service's endpoint list without being restarted, giving the dependency
          # time to recover (docs/04-failure-recovery-design.md, "Database failure").
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Allows slower first-time startup (connection pool warm-up) without the liveness probe
          # prematurely killing a pod that's still initializing.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30 # up to 60s to become live before liveness probing takes over
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem requires an explicit writable mount for anything that needs it
        # (this service doesn't write to disk in its normal request path, but Go's runtime
        # occasionally wants a writable /tmp, e.g. for pprof dumps triggered by an operator).
        - name: tmp
          emptyDir: {}
