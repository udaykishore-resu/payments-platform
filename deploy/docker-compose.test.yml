# Local/CI Postgres for integration tests (see services/payments-api/tests/integration and
# services/payments-api/Makefile's test-integration target). Not used for anything production —
# production Postgres is Aurora, provisioned via deploy/terraform/modules/rds (ADR-002).
version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payments_test
      POSTGRES_PASSWORD: payments_test
      POSTGRES_DB: payments_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_test"]
      interval: 2s
      timeout: 3s
      retries: 20
