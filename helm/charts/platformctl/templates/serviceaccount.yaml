{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pp-common.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "pp-common.labels" . | nindent 4 }}
  annotations:
    # IRSA: one IAM role per deployable, never a shared role (deployment.md §2.3,
    # security.md §5.1). The blast radius of a compromised pod is the union of one
    # role's statements, and each role is small enough to read in one screen.
    eks.amazonaws.com/role-arn: {{ tpl .Values.serviceAccount.roleArnTemplate . | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "3600"
{{- with .Values.serviceAccount.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
