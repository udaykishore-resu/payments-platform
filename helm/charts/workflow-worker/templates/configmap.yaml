apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pp-common.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "pp-common.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
{{/*
  Non-secret configuration only. A CI scan reads every ConfigMap in this repo for
  high-entropy strings and known credential prefixes (sk_live_, AKIA, -----BEGIN)
  and fails the build on a hit (security.md §5.2).
*/}}
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ tpl (printf "%v" $v) $ | quote }}
{{- end }}
