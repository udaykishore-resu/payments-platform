{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pp-common.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "pp-common.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Refresh, not restart: the operator rewrites the projected files in place and
  # the app re-reads them as Secret[T]. A 90-day gateway-credential rotation with
  # a 24h dual-run must not require a deploy (security.md §5.3).
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "pp-common.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        labels:
{{- include "pp-common.labels" . | nindent 10 }}
  data:
{{- include "pp-common.externalSecretRefs" . | nindent 4 }}
{{- end }}
