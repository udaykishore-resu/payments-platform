# staging — pp-staging account, production-shaped, synthetic data only.
#
# Staging runs the SAME canary steps as prod. That is the point of staging:
# the 24h soak plus a load test is where resource leaks, lock contention and
# lag drift appear, and none of those are visible in a fast rollout.
# Replica counts are 2-3, so PDBs are absolute counts rather than
# percentages that round badly.

global:
  environment: staging
  region: eu-west-1
  regionActive: "true"
  imageRegistry: 777788889999.dkr.ecr.eu-west-1.amazonaws.com/payments-platform
  accountId: "777788889999"
  networkCidrs:
    pods:      ["10.30.16.0/20", "10.30.80.0/20", "10.30.96.0/20"]
    database:  ["10.30.32.0/22", "10.30.36.0/22", "10.30.40.0/22"]
    streaming: ["10.30.48.0/22", "10.30.52.0/22", "10.30.56.0/22"]
    egress:    ["10.30.64.0/22", "10.30.68.0/22", "10.30.72.0/22"]

control-plane-api:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: "1"   # absolute: a percentage rounds badly at 2-3 replicas

payment-api:
  enabled: true
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: "1"   # absolute: a percentage rounds badly at 2-3 replicas

payment-orchestrator:
  enabled: true
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: "1"   # absolute: a percentage rounds badly at 2-3 replicas

workflow-worker:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    maxUnavailable: "1"

webhook-ingress:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
