# One ServiceAccount per deployable, one IAM role per ServiceAccount, never a
# shared role (deployment.md §2.3). The blast radius of a compromised pod is
# the union of exactly one role's statements.
#
# The role ARNs here are the *prod* ARNs; the overlays patch the account id and
# environment segment. The same accounts are declared in the Helm charts, which
# is duplication with a purpose: a cluster brought up from the Kustomize base
# alone (a DR rebuild, a kind cluster) has working identities before any Helm
# release is installed, and Argo CD's ServerSideApply merges the two.
#
# automountServiceAccountToken is false everywhere except otel-collector, which
# genuinely reads the Kubernetes API (k8sattributes processor). Mounting a token
# into every pod by default is a lateral-movement gift.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-api
  namespace: pp-control-plane
  labels:
    app.kubernetes.io/name: control-plane-api
    app.kubernetes.io/part-of: payments-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/pp-prod-control-plane-api
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "3600"
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
