  namespace: pp-automation
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hard:
    requests.cpu: "80"
    requests.memory: 160Gi
    limits.memory: 240Gi
    pods: "60"
    # No limits.cpu quota. Quoting a resource forces every container in the
    # namespace to declare it, which would make the deliberate omission of CPU
    # limits on the latency-sensitive services impossible.
    count/persistentvolumeclaims: "0"
    services.nodeports: "0"
---
# Cluster machinery. Bounded so a runaway controller cannot consume the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pp-platform-quota
  namespace: pp-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.memory: 120Gi
    pods: "120"
    # No limits.cpu quota. Quoting a resource forces every container in the
    # namespace to declare it, which would make the deliberate omission of CPU
    # limits on the latency-sensitive services impossible.
    count/persistentvolumeclaims: "0"
    services.nodeports: "0"
---
# otel-gateway tail sampling buffers whole traces, so memory is the real constraint; the DaemonSets scale with the node count.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pp-observability-quota
  namespace: pp-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hard:
    requests.cpu: "80"
    requests.memory: 200Gi
    limits.memory: 300Gi
    pods: "150"
    # No limits.cpu quota. Quoting a resource forces every container in the
    # namespace to declare it, which would make the deliberate omission of CPU
    # limits on the latency-sensitive services impossible.
    count/persistentvolumeclaims: "0"
    services.nodeports: "0"
