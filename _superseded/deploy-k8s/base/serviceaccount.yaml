apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments
  annotations:
    # IRSA (IAM Roles for Service Accounts): pods using this ServiceAccount assume this IAM role
    # for AWS API calls (SQS SendMessage, KMS decrypt for Secrets Manager, etc.) — no static AWS
    # credentials anywhere in the pod. See docs/05-security-architecture.md and
    # deploy/terraform/modules for the IAM role/trust-policy definition.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/payments-api-irsa-role
automountServiceAccountToken: true
