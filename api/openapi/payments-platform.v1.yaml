openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Payments Platform API
  version: 1.0.0
  summary: Multi-tenant payment gateway onboarding and payment orchestration.
  description: |
    The public REST surface of the payments platform. Two products share this contract:

    * **Control plane** (`/v1/merchants`, `/v1/gateways`) — merchant registry, onboarding
      workflow, desired-state configuration and the gateway catalogue. Availability target
      99.9 %. Never on the payment hot path.
    * **Data plane** (`/v1/payments`, `/v1/webhooks`) — payment orchestration against
      third-party gateways. Availability target 99.99 %, p99 <= 250 ms excluding gateway time.

    ## Binding rules

    * **Money** is always an integer in the currency's minor units plus an ISO-4217 code:
      `{"amount": 1050, "currency": "USD"}`. Never a float, never a decimal string.
    * **Identifiers** are `<prefix>_<26-char Crockford Base32 ULID>` and are opaque to
      clients. Do not parse them.
    * **No cardholder data.** This API accepts gateway tokens and vault references only.
      Any request field containing a Luhn-valid 13-19 digit sequence is rejected with
      `400 SENSITIVE_DATA_IN_REQUEST` and the value is never logged. See
      `PaymentMethodReference`.
    * **Idempotency.** Every unsafe operation requires an `Idempotency-Key` header. Replays
      return the stored response with `Idempotent-Replay: true`. A key reused with a
      different request body is `422 IDEMPOTENCY_KEY_REUSED`; a concurrent duplicate while
      the first is still running is `409 IDEMPOTENT_REQUEST_IN_PROGRESS` with `Retry-After`.
    * **Concurrency.** Mutable resources carry an `ETag`; `PATCH` and `PUT` require
      `If-Match`. A mismatch is `412`.
    * **Pagination** is opaque-cursor only (`?limit=&cursor=`), returning
      `{"data": [...], "next_cursor": null}`. There is no offset pagination: it is unstable
      under concurrent writes.
    * **Errors** are RFC 9457 `application/problem+json` with the platform extensions
      `code`, `category`, `retryable`, `requestId`, `traceId`, `details[]` and `docsUrl`.
      The `retryable` flag is machine-readable and is what SDKs branch on.
    * **Retry semantics.** Branch on the `retryable` field, never on the status class. `503`
      is retryable; `4xx` other than `409` (in-flight) and `429` are not. `502` and `504` are
      *ambiguous by default*: a `504`, and a `502 GATEWAY_CONTRACT_VIOLATION`, both mean the
      payment may still be `PROCESSING` at the gateway, so both carry `retryable: false` and
      both are answered by polling `GET /v1/payments/{paymentId}` rather than by re-issuing
      under a fresh idempotency key. `502 GATEWAY_UNAVAILABLE`, where the gateway never
      answered at all, is the retryable one.
    * **Versioning** is by URI major version. Changes within `/v1` are additive only.
      Retirement is announced with the `Deprecation` and `Sunset` response headers.
  termsOfService: https://example.com/legal/api-terms
  contact:
    name: Payments Platform API Team
    url: https://docs.example.com/payments-platform
    email: api-support@example.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-audience: external-public
  x-api-id: payments-platform-v1
externalDocs:
  description: Design baseline, error catalogue and event registry
  url: https://docs.example.com/payments-platform/baseline
servers:
  - url: https://api.example.com
    description: Production. Live money. Requires a production OAuth2 client.
  - url: https://sandbox.api.example.com
    description: Sandbox. Gateway simulators and gateway sandbox accounts only.
  - url: https://{region}.api.example.com
    description: Region-pinned production endpoint for tenants with a data-residency policy.
    variables:
      region:
        default: eu
        enum:
          - eu
          - us
          - ap
        description: Residency region of the tenant. Payment writes are regionally homed.
tags:
  - name: Merchants
    description: |
      Control plane. Merchant registry: create, read, update and list merchants and their
      business profile, bank accounts and principals.
    externalDocs:
      url: https://docs.example.com/payments-platform/control-plane#merchants
  - name: Onboarding
    description: |
      Control plane. The durable onboarding workflow that takes a merchant from `CREATED`
      to `ACTIVE`, including the manual signal gates.
    externalDocs:
      url: https://docs.example.com/payments-platform/onboarding
  - name: Configuration
    description: |
      Control plane. Desired-state configuration documents, their version history and
      rollback. Every write is validated (L4), versioned, audited and published as
      `configuration.published.v1`.
    externalDocs:
      url: https://docs.example.com/payments-platform/control-plane#configuration
  - name: Gateways
    description: |
      Control plane. The read-only gateway catalogue, capability descriptors, per-operation
      health, and credential rotation.
    externalDocs:
      url: https://docs.example.com/payments-platform/gateways
  - name: Payments
    description: |
      Data plane. Payment creation, capture, refund and void. The only money path.
    externalDocs:
      url: https://docs.example.com/payments-platform/payment-flow
  - name: Webhooks
    description: |
      Data plane. Inbound gateway webhook ingestion. Signature-authenticated, accept-and-
      persist only, <= 50 ms budget; processing is asynchronous.
  - name: Operations
    description: Cluster-internal liveness, readiness and metrics endpoints.
x-tagGroups:
  - name: Control plane
    tags:
      - Merchants
      - Onboarding
      - Configuration
      - Gateways
  - name: Data plane
    tags:
      - Payments
      - Webhooks
  - name: Operations
    tags:
      - Operations
security:
  - oauth2:
      - merchants:read
paths:
  /v1/merchants:
    post:
      operationId: createMerchant
      tags: [Merchants]
      summary: Create a merchant
      description: |
        Registers a merchant under the authenticated principal's tenant in state `CREATED`
        and publishes `merchant.created.v1`. The tenant is taken from the access token; a
        `tenantId` supplied in the body is rejected with `403 TENANT_MISMATCH`.

        Creating a merchant does not start onboarding. Call
        `POST /v1/merchants/{merchantId}/onboarding` for that.
      security:
        - oauth2: [merchants:write]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 60
        window: 1m
        burst: 120
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
      responses:
        '201':
          description: Merchant created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      operationId: listMerchants
      tags: [Merchants]
      summary: List merchants
      description: |
        Cursor-paginated list of the tenant's merchants, newest first by ULID order. There is
        no offset pagination: offsets are unstable under concurrent writes.
      security:
        - oauth2: [merchants:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 120
        window: 1m
        burst: 200
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: status
          in: query
          required: false
          description: Filter by merchant lifecycle state. Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MerchantStatus'
          style: form
          explode: true
          example: [ACTIVE, SUSPENDED]
        - name: externalReference
          in: query
          required: false
          description: Filter by the tenant's own identifier for the merchant. Exact match.
          schema:
            type: string
            maxLength: 128
          example: acme-eu-01
      responses:
        '200':
          description: A page of merchants.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      operationId: getMerchant
      tags: [Merchants]
      summary: Get a merchant
      description: |
        Returns the merchant aggregate including business profile, bank accounts and
        principals. The `ETag` is the aggregate version and must be echoed in `If-Match`
        on a subsequent `PATCH`.
      security:
        - oauth2: [merchants:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 600
        window: 1m
        burst: 1000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The merchant.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '304':
          description: Not modified. The caller's `If-None-Match` matched the current version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateMerchant
      tags: [Merchants]
      summary: Update a merchant
      description: |
        Partially updates the merchant's mutable attributes: display name, external
        reference, business profile, bank accounts and principals. Lifecycle state is **not**
        mutable here - it is driven by the onboarding workflow and by the dedicated suspend
        and terminate operations.

        Requires `If-Match` carrying the `ETag` from a prior read. A stale `ETag` is `412`;
        it is never silently overwritten.
      security:
        - oauth2: [merchants:write]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 60
        window: 1m
        burst: 120
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantRequest'
      responses:
        '200':
          description: Merchant updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}/onboarding:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      operationId: startOnboarding
      tags: [Onboarding]
      summary: Start onboarding
      description: |
        Starts workflow `merchant-onboarding@v1` for this merchant and opens an
        `OnboardingCase`. The workflow's business key is the `merchantId`, which guarantees
        exactly one live instance per merchant: starting it twice is a no-op that returns the
        existing case with `200` instead of `201`.
      security:
        - oauth2: [onboarding:write]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 10
        window: 1m
        burst: 10
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOnboardingRequest'
      responses:
        '201':
          description: Onboarding case opened and the workflow instance started.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingCase'
        '200':
          description: |
            A live case already exists for this merchant. The existing case is returned
            unchanged - starting the workflow twice is a no-op by design.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingCase'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      operationId: getOnboardingCase
      tags: [Onboarding]
      summary: Get the onboarding case
      description: |
        Returns the merchant's current (or most recent) onboarding case, its step history,
        L2 validation annotations and the certification report reference once one exists.
      security:
        - oauth2: [onboarding:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 300
        window: 1m
        burst: 600
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: The onboarding case.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingCase'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}/onboarding/signals/{signal}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/SignalPath'
    post:
      operationId: sendOnboardingSignal
      tags: [Onboarding]
      summary: Send a workflow signal
      description: |
        Delivers a signal to the merchant's running workflow instance, unblocking a
        `SignalStep`. Signals are durable and idempotent per
        `(workflowInstanceId, signalName)`: a duplicate delivery is a no-op that replays the
        stored result.

        The `compliance-approval` signal is the manual gate at step 11. It requires the
        `onboarding:approve` scope, is subject to dual control, and the signal itself - actor,
        scopes, source IP, reason and attestation reference - is written to the audit trail.

        A `REJECT` decision on `compliance-approval` moves the merchant to
        `COMPLIANCE_REJECTED`, which routes back to `CONFIGURING` or `KYC_PENDING`, or forward
        to `TERMINATED`. It never fabricates a `CERTIFICATION_FAILED`.
      security:
        - oauth2: [onboarding:approve]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 30
        window: 1m
        burst: 30
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingSignalRequest'
      responses:
        '202':
          description: |
            Signal accepted and durably recorded. The workflow resumes asynchronously; poll
            `GET /v1/merchants/{merchantId}/onboarding` for the new step state.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSignalAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}/configuration:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      operationId: getMerchantConfiguration
      tags: [Configuration]
      summary: Get the active configuration
      description: |
        Returns the merchant's currently active desired-state configuration document and its
        version metadata. The `ETag` is the document digest and must be echoed in `If-Match`
        on `PUT`.
      security:
        - oauth2: [config:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 300
        window: 1m
        burst: 600
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The active configuration document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '304':
          description: Not modified.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: putMerchantConfiguration
      tags: [Configuration]
      summary: Publish a new configuration version
      description: |
        Replaces the merchant's desired-state configuration. The document is validated (L4),
        assigned the next dense version, persisted with the full prior document retained,
        audited with actor and diff, and published as `configuration.published.v1`.

        Configuration history is strictly append-only: this endpoint never mutates an existing
        version. Propagation to the data plane is asynchronous with a p99 budget of 30 s.

        Requires `If-Match` with the current version's `ETag`. A concurrent publish loses with
        `412` and must re-read, re-merge and retry - the platform does not merge configuration
        documents on the caller's behalf.
      security:
        - oauth2: [config:write]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 30
        window: 1m
        burst: 60
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantConfiguration'
      responses:
        '200':
          description: A new configuration version was published.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}/configuration/versions:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      operationId: listConfigurationVersions
      tags: [Configuration]
      summary: List configuration versions
      description: |
        Cursor-paginated version history, newest first. Every version - including those
        created by a rollback - is present; nothing is ever deleted or rewritten.
      security:
        - oauth2: [config:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 120
        window: 1m
        burst: 200
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
