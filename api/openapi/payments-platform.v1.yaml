      responses:
        '200':
          description: A page of configuration versions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/merchants/{merchantId}/configuration/rollback:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      operationId: rollbackConfiguration
      tags: [Configuration]
      summary: Roll back to a previous configuration version
      description: |
        Re-publishes the document of `toVersion` **as a new version** `n+1`. A rollback is an
        append, never a deletion, so the audit trail retains the version being abandoned.

        The target document is **re-validated against L4 at rollback time**, not trusted
        because it was valid when it was first published: a gateway may since have been
        de-registered, a certification expired or a residency policy tightened. If
        re-validation fails the response is `422 CONFIGURATION_INVALID` naming the rules that
        now fail. A rollback that cannot be validated is not a safe rollback.

        Emits both `configuration.rolled_back.v1` (the operator signal) and
        `configuration.published.v1` (what the data plane's ordinary handler consumes).
      security:
        - oauth2: [config:rollback]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 10
        window: 1m
        burst: 10
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationRollbackRequest'
      responses:
        '201':
          description: |
            A new version was created carrying the restored document. Its digest equals the
            restored version's digest, which is the machine-checkable proof that the rollback
            is faithful.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/gateways:
