  /v1/gateways/{gatewayId}/health:
    parameters:
      - $ref: '#/components/parameters/GatewayIdPath'
    get:
      operationId: getGatewayHealth
      tags: [Gateways]
      summary: Get gateway health
      description: |
        Per-operation health and circuit-breaker state for one gateway in one region. Health
        is measured per `(gateway, operation)` and deliberately **not** per merchant:
        per-merchant samples are too sparse to be statistically meaningful.

        This read is `AP` - it may serve a stale snapshot with a decayed confidence rather
        than fail. `observedAtAgeMs` states how stale.
      security:
        - oauth2: [gateways:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 600
        window: 1m
        burst: 1000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: region
          in: query
          required: false
          description: |
            Region whose measurements to return. Defaults to the caller's home region. Health
            measured in another region must not be acted on locally.
          schema:
            type: string
            maxLength: 32
          example: eu-central-1
        - name: operation
          in: query
          required: false
          description: Restrict to one gateway operation. Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GatewayOperation'
          style: form
          explode: true
          example: [AUTHORIZE, CAPTURE]
      responses:
        '200':
          description: Health snapshot, one entry per gateway operation.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayHealthReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/gateways/{gatewayId}/credentials:rotate:
    parameters:
      - $ref: '#/components/parameters/GatewayIdPath'
    post:
      operationId: rotateGatewayCredentials
      tags: [Gateways]
      summary: Rotate gateway credentials
      description: |
        Rotates the API credentials for one merchant's connection to this gateway. Rotation
        runs with a dual-run overlap: the new credential is provisioned and verified (L3)
        before the old one is revoked, so no in-flight authorization is orphaned.

        Credential **material** never appears in a request or a response. Only the secret
        reference and rotation metadata cross this boundary. Requires dual control.
      security:
        - oauth2: [credentials:rotate]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: tenant
        limit: 10
        window: 1m
        burst: 10
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateCredentialsRequest'
      responses:
        '202':
          description: |
            Rotation accepted and running asynchronously with dual-run overlap. Poll the
            connection's `credentialRotatedAt` to observe completion.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRotationAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/payments:
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Create a payment
      description: |
        Creates a payment and dispatches it to the highest-ranked eligible gateway.

        The request pipeline runs in this order and the order is load-bearing:
        authenticate, resolve tenant, authorize, rate limit, L1 schema validation including
        the PAN detector, idempotency claim, merchant context load, L5 payment validation,
        risk engine, routing, attempt persistence, gateway dispatch, L6 response validation,
        L7 state transition plus outbox write in one transaction, idempotency completion.

        **Timeout semantics.** If the gateway call times out or returns an ambiguous transport
        error, the attempt is recorded `TIMEOUT_UNKNOWN`, the payment **stays** `PROCESSING`
        and this endpoint returns `202` with `state: PROCESSING`. It does not return an error,
        because we do not know whether money moved. No timer may fail a payment. Resolution
        comes from a gateway webhook, a reconciler lookup keyed on our deterministic gateway
        idempotency key, or a settlement report. Poll `GET /v1/payments/{paymentId}`.

        **Never** re-issue a timed-out payment with a new idempotency key. Retry with the same
        key, or poll.
      security:
        - oauth2: [payments:write]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 300
        window: 1s
        burst: 600
        policy: token-bucket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: |
            The payment reached a synchronous terminal-for-now state: `AUTHORIZED`,
            `CAPTURED`, `REQUIRES_ACTION`, `FAILED` or `CANCELED`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                authorized:
                  summary: Authorized, manual capture
                  value:
                    id: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
                    merchantId: mrc_01JB8Z11111111111111111111
                    state: AUTHORIZED
                    amount: { amount: 1050, currency: USD }
                    authorizedAmount: { amount: 1050, currency: USD }
                    capturedAmount: { amount: 0, currency: USD }
                    refundedAmount: { amount: 0, currency: USD }
                    paymentMethod: CARD
                    captureMode: MANUAL
                    riskDecision: ALLOW
                    riskScore: 12
                    threeDsStatus: EXEMPT_LOW_VALUE
                    routingPlanId: rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE
                    currentAttemptId: att_01JB8Z44444444444444444444
                    statementDescriptor: ACME* ORDER 4471
                    metadata: { orderId: '4471' }
                    reconciliationRequired: false
                    expiresAt: '2026-09-02T14:03:11.000Z'
                    version: 3
                    createdAt: '2026-08-26T14:03:10.980Z'
                    updatedAt: '2026-08-26T14:03:11.412Z'
                requiresAction:
                  summary: 3DS challenge required
                  value:
                    id: pay_01JB8ZPPPPPPPPPPPPPPPPPPPP
                    merchantId: mrc_01JB8Z11111111111111111111
                    state: REQUIRES_ACTION
                    amount: { amount: 89900, currency: EUR }
                    capturedAmount: { amount: 0, currency: EUR }
                    refundedAmount: { amount: 0, currency: EUR }
                    paymentMethod: CARD
                    captureMode: AUTOMATIC
                    riskDecision: REQUIRE_3DS
                    riskScore: 61
                    threeDsStatus: CHALLENGE_REQUIRED
                    nextAction:
                      type: REDIRECT
                      redirectUrl: https://3ds.adyen.example/challenge/6f2a1c
                      expiresAt: '2026-08-26T14:18:11.000Z'
                    routingPlanId: rpl_01JB8ZQQQQQQQQQQQQQQQQQQQQ
                    currentAttemptId: att_01JB8ZRRRRRRRRRRRRRRRRRRRR
                    reconciliationRequired: false
                    version: 2
                    createdAt: '2026-08-26T14:03:10.980Z'
                    updatedAt: '2026-08-26T14:03:11.204Z'
        '202':
          description: |
            The outcome is not yet known. The payment is `PROCESSING` (gateway timeout or
            ambiguous transport error, attempt recorded `TIMEOUT_UNKNOWN`) or `PENDING`
            (asynchronous payment method). This is **not** a failure. Poll the payment.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                processingUnknown:
                  summary: Gateway timed out; outcome unknown, reconciliation queued
                  value:
                    id: pay_01JB8ZSSSSSSSSSSSSSSSSSSSS
                    merchantId: mrc_01JB8Z11111111111111111111
                    state: PROCESSING
                    amount: { amount: 1050, currency: USD }
                    capturedAmount: { amount: 0, currency: USD }
                    refundedAmount: { amount: 0, currency: USD }
                    paymentMethod: CARD
                    captureMode: AUTOMATIC
                    riskDecision: ALLOW
                    currentAttemptId: att_01JB8ZHHHHHHHHHHHHHHHHHHHH
                    reconciliationRequired: true
                    version: 2
                    createdAt: '2026-08-26T14:03:10.980Z'
                    updatedAt: '2026-08-26T14:03:19.001Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments
      description: |
        Cursor-paginated payment list, newest first. Reads are served from a replica and may
        be up to 1 s stale; a caller that has just written reads its own write via the
        write-token fallback to the primary.
      security:
        - oauth2: [payments:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 60
        window: 1s
        burst: 120
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: merchantId
          in: query
          required: false
          description: |
            Restrict to one merchant. Required for principals whose token is tenant-scoped
            rather than merchant-scoped when the tenant has more than 1000 merchants.
          schema:
            $ref: '#/components/schemas/MerchantId'
          example: mrc_01JB8Z11111111111111111111
        - name: state
          in: query
          required: false
          description: Filter by payment state. Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentState'
          style: form
          explode: true
          example: [AUTHORIZED, CAPTURED]
        - name: createdAfter
          in: query
          required: false
          description: Inclusive lower bound on creation time (RFC 3339, UTC).
          schema:
            type: string
            format: date-time
          example: '2026-08-01T00:00:00.000Z'
        - name: createdBefore
          in: query
          required: false
          description: Exclusive upper bound on creation time (RFC 3339, UTC).
          schema:
            type: string
            format: date-time
          example: '2026-09-01T00:00:00.000Z'
        - name: reconciliationRequired
          in: query
          required: false
          description: Only payments parked awaiting reconciliation.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: A page of payments.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Get a payment
      description: |
        Returns the payment with its attempts, refunds and routing plan reference. This is the
        endpoint to poll after a `202`, after a `504`, or while a payment is in
        `REQUIRES_ACTION`.
      security:
        - oauth2: [payments:read]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 300
        window: 1s
        burst: 600
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: expand
          in: query
          required: false
          description: |
            Embed related resources. `attempts` and `refunds` are embedded by default;
            `routingPlan` is not, because it is an audit artifact and is comparatively large.
          schema:
            type: array
            items:
              type: string
              enum: [attempts, refunds, routingPlan]
          style: form
          explode: true
          example: [routingPlan]
      responses:
        '200':
          description: The payment.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '304':
          description: Not modified.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/payments/{paymentId}/capture:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    post:
      operationId: capturePayment
      tags: [Payments]
      summary: Capture an authorized payment
      description: |
        Converts an authorization hold into a debit. Legal only from `AUTHORIZED`.

        Partial capture is supported where both the gateway capability descriptor and the
        merchant's `limits.maxPartialCaptures` allow it. The cumulative captured total may
        never exceed the authorized amount (invariant I2); an attempt to exceed it is
        `422 AMOUNT_EXCEEDS_LIMIT`. Omitting `amount` captures the full remaining authorized
        amount and sets `isFinalCapture`.

        A capture on a payment that is already `CAPTURED` is `409 PAYMENT_ALREADY_PROCESSED`
        unless it is an idempotent replay of the same request.
      security:
        - oauth2: [payments:capture]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 100
        window: 1s
        burst: 200
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '200':
          description: Captured. The payment is `CAPTURED`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '202':
          description: |
            The capture outcome is unknown (gateway timeout). The payment remains
            `PROCESSING` and reconciliation is queued. Poll rather than retrying with a new
            key.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/payments/{paymentId}/refund:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    post:
      operationId: refundPayment
      tags: [Payments]
      summary: Refund a captured payment
      description: |
        Returns money to the payer. Legal from `CAPTURED`, `SETTLED` and
        `PARTIALLY_REFUNDED`. Refunding after settlement is the normal case, not an
        exception.

        The cumulative refunded total may never exceed the captured total (invariant I1),
        enforced in the aggregate, by a database `CHECK` and by a serialized update of the
        payment row. Exceeding it is `422 REFUND_EXCEEDS_CAPTURED`.

        Refunds remain available while a merchant is `SUSPENDED`: suspension rejects new
        payments but must always permit giving money back.
      security:
        - oauth2: [payments:refund]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 50
        window: 1s
        burst: 100
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: |
            Refund accepted and executed. The payment is `PARTIALLY_REFUNDED` or `REFUNDED`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '202':
          description: |
            Refund accepted; the gateway has not yet confirmed. The refund is `PROCESSING`
            and the reserved amount is already counted against the I1 budget.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/payments/{paymentId}/void:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    post:
      operationId: voidPayment
      tags: [Payments]
      summary: Void an authorization
      description: |
        Reverses an authorization hold before capture. Legal only from `AUTHORIZED`; the
        result is the terminal state `VOIDED`.

        A partial void is not an operation this platform offers - the voided amount always
        equals the authorized amount. To return part of a capture, use refund.

        Voids remain available while a merchant is `SUSPENDED`.
      security:
        - oauth2: [payments:void]
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: merchant
        limit: 50
        window: 1s
        burst: 100
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
      responses:
        '200':
          description: Voided. The payment is `VOIDED`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '202':
          description: The void outcome is unknown; reconciliation queued.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/webhooks/{gateway}:
    parameters:
      - $ref: '#/components/parameters/GatewayCodePath'
    post:
      operationId: receiveGatewayWebhook
      tags: [Webhooks]
      summary: Receive a gateway webhook
      description: |
        Inbound webhook ingress for one gateway. Authenticated by the gateway's own signature
        scheme, **not** by an OAuth2 token - the caller is the gateway, which has no platform
        credential.

        This endpoint is accept-and-persist only, with a 50 ms server budget: verify the
        signature and the timestamp window, deduplicate on the gateway's event id, persist the
        raw body, publish `webhook.received.v1`, return `202`. All interpretation happens
        asynchronously. Returning quickly is what stops a gateway's retry policy from
        amplifying an incident.

        Replay protection: the signature timestamp must be within +/-5 minutes of server time
        and the gateway event id must not have been seen before. A duplicate is answered
        `200` with `duplicate: true` so the gateway stops retrying; it is not an error.
      security:
        - gatewaySignature: []
      x-idempotent: true
      x-rate-limit:
        scope: gateway
        limit: 2000
        window: 1s
        burst: 5000
      parameters:
        - name: X-Signature-Timestamp
          in: header
          required: false
          description: |
            Unix epoch seconds of signing, for gateways whose scheme carries the timestamp
            separately from the signature. Outside a +/-5 minute window the request is
            rejected as a replay.
          schema:
            type: string
            pattern: '^[0-9]{10}$'
          example: '1787661791'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        description: |
          The gateway's raw event body, passed through verbatim. The platform does not
          impose a schema on a foreign vocabulary at ingress; translation is the
          anti-corruption layer's job, and it runs later.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayWebhookEnvelope'
      responses:
        '202':
          description: Accepted, persisted and queued for asynchronous processing.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '200':
          description: |
            Already seen. Deduplicated on the gateway event id and dropped. Returned as a
            success so the gateway stops retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: |
            Body exceeds the ingest cap. The gateway must use its own payload-reference
            mechanism.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /healthz:
    get:
      operationId: getHealthz
      tags: [Operations]
      summary: Health check
      description: |
        Shallow process health. Returns `200` while the process is running and its
        configuration loaded. Never checks downstream dependencies - a health check that
        fails because a gateway is slow will take a whole deployment out of rotation for
        something it can serve around.
      security: []
      x-idempotent: true
      x-rate-limit:
        scope: none
        limit: 0
        window: 0s
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadyz
      tags: [Operations]
      summary: Readiness check
      description: |
        Deep readiness: database writer reachable, configuration snapshot within
        `max_config_staleness`, outbox writable. A failure sheds this instance from the load
        balancer without terminating it.
      security: []
      x-idempotent: true
      x-rate-limit:
        scope: none
        limit: 0
        window: 0s
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready. Dependency detail is in `checks`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /livez:
    get:
      operationId: getLivez
      tags: [Operations]
      summary: Liveness check
      description: |
        Liveness only. A failure means the process is wedged and must be restarted. It checks
        nothing that a restart cannot fix, which is why it never checks a dependency.
      security: []
      x-idempotent: true
      x-rate-limit:
        scope: none
        limit: 0
        window: 0s
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Wedged; restart required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        OpenMetrics exposition. Cluster-internal only; never routed from the public ingress.
        `merchant_id` and `payment_id` are never metric labels - they live in logs, traces and
        exemplars.
      security:
        - mtls: []
      x-idempotent: true
      x-rate-limit:
        scope: none
        limit: 0
        window: 0s
      responses:
        '200':
          description: Metrics in OpenMetrics text format.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # TYPE pp_payments_total counter
                pp_payments_total{outcome="authorized",currency="USD",payment_method="CARD",gateway="stripe",tenant_tier="pooled"} 184213
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
webhooks:
  paymentAuthorized:
    post:
      operationId: onPaymentAuthorized
      tags: [Webhooks]
      summary: payment.authorized.v1
      description: |
        Delivered to each merchant webhook endpoint subscribed to `payment.*` or
        `payment.authorized.v1`. Body is the platform event envelope; `data` matches
        `api/events/payment.authorized.v1.schema.json`.

        Verify `X-PP-Signature` before parsing. Respond `2xx` within 5 s; anything else is
        retried per the merchant's `webhooks.retryPolicy` (default 8 attempts, exponential
        with jitter). Delivery is at-least-once - deduplicate on the envelope `id`.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted. The platform stops retrying.
        '410':
          description: |
            Endpoint permanently gone. The platform disables it and raises an operator alert
            rather than retrying for hours.
        default:
          description: Any non-2xx schedules a retry per the merchant's retry policy.
  paymentCaptured:
    post:
      operationId: onPaymentCaptured
      tags: [Webhooks]
      summary: payment.captured.v1
      description: |
        Funds captured. `data.capturedTotal` is cumulative; `data.capturedAmount` is this
        capture only. Ledger consumers post on the delta and reconcile on the total.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  paymentFailed:
    post:
      operationId: onPaymentFailed
      tags: [Webhooks]
      summary: payment.failed.v1
      description: |
        Terminal failure. `data.failureStage` says where in the pipeline it died and
        `data.declineIsRetryable` says whether another gateway could have succeeded. A hard
        decline is never retried on another gateway - that is card-testing behaviour.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  paymentRefunded:
    post:
      operationId: onPaymentRefunded
      tags: [Webhooks]
      summary: payment.refunded.v1
      description: Refund succeeded. `data.isFullRefund` distinguishes `REFUNDED` from `PARTIALLY_REFUNDED`.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  paymentVoided:
    post:
      operationId: onPaymentVoided
      tags: [Webhooks]
      summary: payment.voided.v1
      description: Authorization reversed before capture.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  paymentSettled:
    post:
      operationId: onPaymentSettled
      tags: [Webhooks]
      summary: payment.settled.v1
      description: |
        Settlement observed in a gateway report. The platform does not compute settlement; it
        ingests and reconciles what the gateway reports.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  paymentDisputed:
    post:
      operationId: onPaymentDisputed
      tags: [Webhooks]
      summary: payment.disputed.v1
      description: |
        A dispute was opened, advanced or resolved. `data.evidenceDueBy` is the deadline the
        merchant must act on.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  merchantActivated:
    post:
      operationId: onMerchantActivated
      tags: [Webhooks]
      summary: merchant.activated.v1
      description: The merchant may now process live payments. Carries a warm-cache payload.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  merchantSuspended:
    post:
      operationId: onMerchantSuspended
      tags: [Webhooks]
      summary: merchant.suspended.v1
      description: |
        New payments are now rejected. Refunds, voids and webhook processing continue -
        `data.permitsRefunds` is always `true` and is carried explicitly so no consumer has to
        remember the rule.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
  onboardingStateChanged:
    post:
      operationId: onOnboardingStateChanged
      tags: [Webhooks]
      summary: merchant onboarding lifecycle events
      description: |
        Delivered for `merchant.validated.v1`, `merchant.kyc_approved.v1`,
        `merchant.kyc_failed.v1`, `merchant.bank_validated.v1`,
        `merchant.gateway_provisioned.v1` and `merchant.certified.v1`. Discriminate on the
        envelope `type`; a consumer that cannot recognise a type must ignore it, never fail.
      security:
        - merchantWebhookSignature: []
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted.
        default:
          description: Any non-2xx schedules a retry.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 client credentials. Tokens are `ES256` JWTs with a 15-minute TTL and
        audience `https://api.example.com`.

        **The tenant is taken from the token, never from the request.** A `tenantId` in a body
        or query string that disagrees with the token is a security event:
        `403 TENANT_MISMATCH`, audited and alerted.

        The token endpoint is rate limited to 100 requests / 5 min per IP and 20 / min per
        client. Scopes are minted per client, not requested per call: asking for a scope the
        client was not granted returns `invalid_scope` rather than a narrowed token.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          refreshUrl: https://auth.example.com/oauth2/token
          scopes:
            merchants:read: Read merchants, business profiles, bank accounts and principals.
            merchants:write: Create and update merchants.
            merchants:suspend: Suspend and resume a merchant.
            merchants:terminate: Terminate a merchant. Dual control required.
            onboarding:read: Read onboarding cases and step history.
            onboarding:write: Start and drive onboarding.
            onboarding:approve: Signal a manual onboarding gate. Dual control required.
            config:read: Read configuration documents and version history.
            config:write: Publish a new configuration version.
            config:rollback: Roll back configuration to an earlier version. Dual control required.
            gateways:read: Read the gateway catalogue and health.
            gateways:write: Register and deprecate gateways. Platform administrators only.
            credentials:rotate: Rotate gateway credentials. Dual control required.
            credentials:read: Read credential metadata for the caller's own path. Internal workloads only.
            payments:read: Read payments, attempts and refunds.
            payments:write: Create payments. Machine clients only - no human role holds this scope.
            payments:capture: Capture an authorized payment.
            payments:refund: Refund a captured payment. Dual control for human principals.
            payments:void: Void an authorization.
            payments:replay_dlq: Replay dead-lettered payment events. Operators only.
            ledger:read: Read ledger accounts and entries.
            ledger:write: Append ledger entries. Event consumer only.
            audit:read: Read the audit trail for the caller's tenant.
            audit:export: Export the audit trail. Dual control required.
            tenants:read: Read tenant records.
            tenants:write: Create and update tenants. Dual control required.
    mtls:
      type: mutualTLS
      description: |
        Mutual TLS for internal service-to-service callers inside the mesh, identified by a
        SPIFFE ID in the client certificate SAN
        (`spiffe://payments.example.com/ns/<namespace>/sa/<service-account>`).

        An mTLS identity is **not tenant-scoped**. It may never satisfy a tenant-scoped read
        on its own: the caller must propagate an explicit tenant context, which the isolation
        guard checks against the requested resource. Presenting a mesh certificate is proof of
        *which service* is calling, never of *which tenant's data* it may see.
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
      description: |
        **This is an HMAC signature over the request body, not a bearer token.** It is
        modelled as `apiKey` because OpenAPI has no native signature scheme; treating it as a
        shared secret to be replayed would be a security defect.

        The header carries the gateway's own signature construction - for example
        `t=<unix-seconds>,v1=<hex HMAC-SHA256>` for Stripe-style schemes, a base64 Ed25519
        signature for others, or a detached JWS. The exact scheme per gateway is declared in
        the gateway's capability descriptor as `webhookSignatureScheme`.

        Verification, in this order: (1) the timestamp is within +/-5 minutes of server time,
        (2) the signature verifies over the exact raw bytes received - never over a re-encoded
        parse, (3) the gateway event id has not been seen before. A failure is
        `401 WEBHOOK_SIGNATURE_INVALID` or `401 WEBHOOK_REPLAY_DETECTED`, both raised as
        security events. The secret is fetched per `(tenant, merchant, gateway)` from the
        secrets manager and never appears in configuration, logs or events.
    merchantWebhookSignature:
      type: apiKey
      in: header
      name: X-PP-Signature
      description: |
        **Outbound direction.** The signature this platform puts on webhooks it delivers to a
        merchant endpoint. Format `t=<unix-seconds>,v1=<hex HMAC-SHA256>` computed over
        `<timestamp>.<raw body>` with the endpoint's `secretRef` secret.

        Again an HMAC, not a bearer token: it authenticates *us* to *the merchant*. Merchants
        must compare with a constant-time comparison and must reject a timestamp older than
        5 minutes, otherwise a captured delivery can be replayed indefinitely.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-supplied opaque key scoping one logical operation to one effect. Required on
        every unsafe operation.

        The idempotency scope is
        `(tenant_id, merchant_id, method, path_template, idempotency_key)`. A SHA-256
        fingerprint of the JCS-canonicalized request body is stored with the key: the same key
        with a different body is `422 IDEMPOTENCY_KEY_REUSED`, which is the check that catches
        a client reusing one key for two different payments.

        A concurrent duplicate while the first request is still in flight is
        `409 IDEMPOTENT_REQUEST_IN_PROGRESS` with `Retry-After: 1`. The platform does not
        block the second caller and does not process twice.

        Recommended: a UUIDv4 per logical operation, generated **before** the first attempt and
        reused across every retry of that operation. Records are retained 7 days.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]{1,255}$'
      example: 6b3f1a52-9e7c-4b4f-8f4a-1c2d3e4f5a6b
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `ETag` of the version the caller intends to modify, for optimistic concurrency. A
        mismatch is `412 CONFIGURATION_VERSION_CONFLICT` or `412` with the resource's conflict
        code - the write is never silently applied on top of someone else's. Omitting the
        header on an endpoint that requires it is `428`.
      schema:
        type: string
        maxLength: 128
      example: '"7"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Conditional read. If the current `ETag` matches, the response is `304` with no body.
      schema:
        type: string
        maxLength: 128
      example: '"7"'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Caller-supplied request identifier, echoed on every response including errors. If
        absent the platform generates a `req_`-prefixed ULID. It appears in the problem
        document as `requestId` and on every log line and audit record for this request.
      schema:
        type: string
        maxLength: 128
      example: req_01JB8Z22222222222222222222
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C Trace Context. Propagated into every span, event envelope and gateway call, and
        echoed on the response. If absent a new trace is started. Format
        `00-<32 hex trace-id>-<16 hex span-id>-<2 hex flags>`.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Business correlation identifier that stays constant across an entire causal fan-out,
        so one API call's full consequences - payments, attempts, events, audit records - are
        one query. Copied into `correlationid` on every event this request produces. Defaults
        to the request id.
      schema:
        type: string
        maxLength: 128
      example: req_01JB8Z22222222222222222222
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token from a previous response's `next_cursor`. Cursors are
        signed, tied to the tenant and to the exact filter set of the originating request, and
        expire after 24 hours. Do not construct, parse or reuse one across different filters.

        There is deliberately no offset pagination: offsets are unstable under concurrent
        writes and silently skip or duplicate rows on a busy list.
      schema:
        type: string
        maxLength: 512
      example: eyJrIjoicGF5XzAxSkI4WjlLMlFXM0U0UjVUNlk3VThJOU8wIn0
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: The merchant identifier. Opaque to clients.
      schema:
        $ref: '#/components/schemas/MerchantId'
      example: mrc_01JB8Z11111111111111111111
    PaymentIdPath:
      name: paymentId
      in: path
      required: true
      description: The payment identifier. Opaque to clients.
      schema:
        $ref: '#/components/schemas/PaymentId'
      example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
    GatewayIdPath:
      name: gatewayId
      in: path
      required: true
      description: The gateway identifier. Opaque to clients.
      schema:
        $ref: '#/components/schemas/GatewayId'
      example: stripe
    GatewayCodePath:
      name: gateway
      in: path
      required: true
      description: |
        The gateway's stable code, used on the webhook ingress path because the gateway
        configures a URL and cannot know our opaque identifiers.
      schema:
        $ref: '#/components/schemas/GatewayCode'
      example: stripe
    SignalPath:
      name: signal
      in: path
      required: true
      description: |
        The workflow signal name. `kyc-decision` resolves the KYC signal wait at step 3,
        `compliance-approval` is the manual compliance gate at step 11, and `gateway-consent`
        completes a gateway-hosted merchant consent flow during provisioning at step 5.
      schema:
        $ref: '#/components/schemas/OnboardingSignalName'
      example: compliance-approval
  headers:
    ETag:
      description: |
        The resource's optimistic-concurrency token: the aggregate version for merchants and
        payments, the document digest for configuration. Echo it in `If-Match`.
      required: true
      schema:
        type: string
      example: '"7"'
    Location:
      description: Absolute URL of the created or affected resource.
      required: false
      schema:
        type: string
        format: uri
      example: https://api.example.com/v1/payments/pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
    IdempotentReplay:
      description: |
        `true` when this response was replayed from a stored idempotency record rather than
        produced by executing the operation again. Absent or `false` on first execution.
      required: false
      schema:
        type: boolean
      example: true
    XRequestId:
      description: The request identifier, echoed or generated. Always present.
      required: true
      schema:
        type: string
      example: req_01JB8Z22222222222222222222
    RetryAfter:
      description: |
        Seconds to wait before retrying. Present on `409 IDEMPOTENT_REQUEST_IN_PROGRESS`,
        `429`, `503` and on `202` responses where polling is the correct next step.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 1
    RateLimitLimit:
      description: Requests permitted in the current window for this scope.
      required: false
      schema:
        type: integer
        format: int32
      example: 300
    RateLimitRemaining:
      description: Requests remaining in the current window.
      required: false
      schema:
        type: integer
        format: int32
      example: 271
    RateLimitReset:
      description: Seconds until the current window resets.
      required: false
      schema:
        type: integer
        format: int32
      example: 1
    CacheControl:
      description: Caching directive. Money-path responses are always `no-store`.
      required: false
      schema:
        type: string
      example: no-store
    Deprecation:
      description: |
        RFC 8594. Present on an operation scheduled for removal, carrying the date the
        deprecation took effect.
      required: false
      schema:
        type: string
      example: '@1798761600'
    Sunset:
      description: |
        RFC 8594. The date after which the operation will stop working. Never less than
        180 days after `Deprecation`.
      required: false
      schema:
        type: string
      example: Wed, 01 Jul 2026 00:00:00 GMT
  responses:
    BadRequest:
      description: |
        The request could not be parsed or failed L1 schema validation. Not retryable without
        changing the request.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              summary: VALIDATION_FAILED
              value:
                type: https://errors.example.com/VALIDATION_FAILED
                title: Request failed schema validation
                status: 400
                code: VALIDATION_FAILED
                detail: '2 fields failed validation.'
                category: VALIDATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: amount.currency
                    code: NOT_ISO_4217
                    message: '"US" is not a valid ISO 4217 alphabetic code.'
                  - field: statementDescriptor
                    code: TOO_LONG
                    message: Must be at most 22 characters.
                docsUrl: https://docs.example.com/errors/VALIDATION_FAILED
            sensitiveDataInRequest:
              summary: SENSITIVE_DATA_IN_REQUEST
              description: |
                The L1 PAN detector found a Luhn-valid 13-19 digit sequence. The offending
                value is neither echoed nor logged, and a security event is raised. This API
                accepts gateway tokens and vault references only.
              value:
                type: https://errors.example.com/SENSITIVE_DATA_IN_REQUEST
                title: Request contained cardholder data
                status: 400
                code: SENSITIVE_DATA_IN_REQUEST
                detail: >-
                  A field in this request matched the primary account number detector. The
                  value has been discarded and was not logged. Submit a gateway token or a
                  vault reference instead of card data.
                category: VALIDATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: paymentMethod.token
                    code: PAN_DETECTED
                    message: Value redacted. Cardholder data must never reach this API.
                docsUrl: https://docs.example.com/errors/SENSITIVE_DATA_IN_REQUEST
            idempotencyKeyRequired:
              summary: IDEMPOTENCY_KEY_REQUIRED
              value:
                type: https://errors.example.com/IDEMPOTENCY_KEY_REQUIRED
                title: Idempotency-Key header is required
                status: 400
                code: IDEMPOTENCY_KEY_REQUIRED
                detail: 'POST /v1/payments requires an Idempotency-Key header of 1-255 characters.'
                category: VALIDATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/IDEMPOTENCY_KEY_REQUIRED
    Unauthorized:
      description: Authentication is missing, malformed, expired or failed signature verification.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        WWW-Authenticate:
          description: Challenge indicating the expected scheme.
          schema:
            type: string
          example: Bearer realm="payments-platform", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              summary: UNAUTHENTICATED
              value:
                type: https://errors.example.com/UNAUTHENTICATED
                title: Authentication failed
                status: 401
                code: UNAUTHENTICATED
                detail: The access token has expired.
                category: AUTHENTICATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/UNAUTHENTICATED
            webhookSignatureInvalid:
              summary: WEBHOOK_SIGNATURE_INVALID
              value:
                type: https://errors.example.com/WEBHOOK_SIGNATURE_INVALID
                title: Webhook signature verification failed
                status: 401
                code: WEBHOOK_SIGNATURE_INVALID
                detail: The X-Gateway-Signature header did not verify over the received body.
                category: AUTHENTICATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/WEBHOOK_SIGNATURE_INVALID
    Forbidden:
      description: |
        The principal is authenticated but not permitted. Includes tenant isolation
        violations, which are also raised as security events and alerted.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              summary: FORBIDDEN
              value:
                type: https://errors.example.com/FORBIDDEN
                title: Insufficient scope
                status: 403
                code: FORBIDDEN
                detail: 'This operation requires scope payments:refund.'
                category: AUTHORIZATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/FORBIDDEN
            tenantMismatch:
              summary: TENANT_MISMATCH
              value:
                type: https://errors.example.com/TENANT_MISMATCH
                title: Resource belongs to a different tenant
                status: 403
                code: TENANT_MISMATCH
                detail: >-
                  The requested resource is not owned by the tenant in the access token. This
                  attempt has been recorded as a security event.
                category: AUTHORIZATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/TENANT_MISMATCH
    NotFound:
      description: |
        No such resource within the caller's tenant. A resource that exists under another
        tenant is indistinguishable from one that does not exist - by design.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paymentNotFound:
              summary: PAYMENT_NOT_FOUND
              value:
                type: https://errors.example.com/PAYMENT_NOT_FOUND
                title: Payment not found
                status: 404
                code: PAYMENT_NOT_FOUND
                detail: No payment pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0 exists for this tenant.
                category: NOT_FOUND
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/PAYMENT_NOT_FOUND
            merchantNotFound:
              summary: MERCHANT_NOT_FOUND
              value:
                type: https://errors.example.com/MERCHANT_NOT_FOUND
                title: Merchant not found
                status: 404
                code: MERCHANT_NOT_FOUND
                detail: No merchant mrc_01JB8Z11111111111111111111 exists for this tenant.
                category: NOT_FOUND
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/MERCHANT_NOT_FOUND
    Conflict:
      description: |
        The request conflicts with the resource's current state. `IDEMPOTENT_REQUEST_IN_PROGRESS`
        is the one conflict that **is** retryable, after `Retry-After`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotentRequestInProgress:
              summary: IDEMPOTENT_REQUEST_IN_PROGRESS
              description: |
                Another request with this idempotency key is still executing. The platform
                neither blocks this caller nor processes twice. Retry after the stated delay;
                the completed response will then be replayed.
              value:
                type: https://errors.example.com/IDEMPOTENT_REQUEST_IN_PROGRESS
                title: A request with this idempotency key is already in progress
                status: 409
                code: IDEMPOTENT_REQUEST_IN_PROGRESS
                detail: >-
                  Idempotency key 6b3f1a52-9e7c-4b4f-8f4a-1c2d3e4f5a6b is claimed by an
                  in-flight request whose lease expires at 2026-08-26T14:03:41.000Z. Retry
                  after 1 second to receive the stored response.
                category: CONFLICT
                retryable: true
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: Idempotency-Key
                    code: LEASE_HELD
                    message: Lease expires at 2026-08-26T14:03:41.000Z.
                docsUrl: https://docs.example.com/errors/IDEMPOTENT_REQUEST_IN_PROGRESS
            invalidStateTransition:
              summary: INVALID_STATE_TRANSITION
              description: |
                The requested operation is not a legal transition from the resource's current
                state. Absent transitions are rejected, never coerced.
              value:
                type: https://errors.example.com/INVALID_STATE_TRANSITION
                title: Invalid state transition
                status: 409
                code: INVALID_STATE_TRANSITION
                detail: >-
                  Payment pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0 is in state CAPTURED. Void is legal
                  only from AUTHORIZED. To return funds after capture, use refund.
                category: CONFLICT
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: state
                    code: TRANSITION_NOT_ALLOWED
                    message: 'CAPTURED -> VOIDED is not in the transition table.'
                docsUrl: https://docs.example.com/errors/INVALID_STATE_TRANSITION
            paymentAlreadyProcessed:
              summary: PAYMENT_ALREADY_PROCESSED
              value:
                type: https://errors.example.com/PAYMENT_ALREADY_PROCESSED
                title: Payment has already been processed
                status: 409
                code: PAYMENT_ALREADY_PROCESSED
                detail: >-
                  Payment pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0 is in state CAPTURED and cannot be
                  captured again.
                category: BUSINESS_RULE
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: amount
                    code: EXCEEDS_CAPTURABLE
                    message: No capturable balance remains on this authorization.
                docsUrl: https://docs.example.com/errors/PAYMENT_ALREADY_PROCESSED
            merchantNotActive:
              summary: MERCHANT_NOT_ACTIVE
              description: |
                New payments require an `ACTIVE` merchant. A `SUSPENDED` merchant still
                accepts refunds, voids and webhook processing - you must always be able to
                give money back.
              value:
                type: https://errors.example.com/MERCHANT_NOT_ACTIVE
                title: Merchant is not active
                status: 409
                code: MERCHANT_NOT_ACTIVE
                detail: >-
                  Merchant mrc_01JB8Z11111111111111111111 is in state SUSPENDED
                  (reason COMPLIANCE_EXPIRY) and may not create new payments. Refunds and
                  voids remain available.
                category: BUSINESS_RULE
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: merchantId
                    code: MERCHANT_STATE
                    message: 'Current state: SUSPENDED. Required: ACTIVE.'
                docsUrl: https://docs.example.com/errors/MERCHANT_NOT_ACTIVE
    PreconditionFailed:
      description: |
        The `If-Match` precondition did not hold: the resource changed since the caller read
        it. Re-read, re-apply the change and retry. The write is never merged automatically.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            configurationVersionConflict:
              summary: CONFIGURATION_VERSION_CONFLICT
              value:
                type: https://errors.example.com/CONFIGURATION_VERSION_CONFLICT
                title: Configuration version conflict
                status: 412
                code: CONFIGURATION_VERSION_CONFLICT
                detail: >-
                  If-Match specified version 6 but the active version is 7, published at
                  2026-08-27T18:59:12.006Z. Re-read the configuration and re-apply your change.
                category: CONFLICT
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/CONFIGURATION_VERSION_CONFLICT
    PreconditionRequired:
      description: The operation requires `If-Match` and none was supplied.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            preconditionRequired:
              summary: PRECONDITION_REQUIRED
              value:
                type: https://errors.example.com/PRECONDITION_REQUIRED
                title: If-Match header is required
                status: 428
                code: PRECONDITION_REQUIRED
                detail: >-
                  This operation requires an If-Match header carrying the ETag from a prior
                  read, so that a concurrent modification cannot be silently overwritten.
                category: CONFLICT
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/PRECONDITION_REQUIRED
    UnprocessableEntity:
      description: |
        The request was well formed but violates a business rule (L2, L4 or L5 validation).
        Not retryable without changing the request or the underlying configuration.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              summary: IDEMPOTENCY_KEY_REUSED
              description: |
                The key has already been used for a **different** request body. This is
                almost always a client bug - one key reused for two different payments - and
                the platform refuses rather than guessing which one was meant.
              value:
                type: https://errors.example.com/IDEMPOTENCY_KEY_REUSED
                title: Idempotency key reused with a different request
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                detail: >-
                  Idempotency key 6b3f1a52-9e7c-4b4f-8f4a-1c2d3e4f5a6b was first used at
                  2026-08-26T14:03:10.980Z with a different request body. Use a new key for a
                  new logical operation, or resend the original request body byte-for-byte.
                category: VALIDATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: Idempotency-Key
                    code: FINGERPRINT_MISMATCH
                    message: 'Stored fingerprint 3a7f...c001 does not match request fingerprint 9d21...44be.'
                docsUrl: https://docs.example.com/errors/IDEMPOTENCY_KEY_REUSED
            riskDeclined:
              summary: RISK_DECLINED
              description: |
                The risk policy declined the payment before any gateway was contacted. No
                money moved and no attempt was created. The risk engine fails open to the
                *policy default*, never to "allow".
              value:
                type: https://errors.example.com/RISK_DECLINED
                title: Payment declined by risk policy
                status: 422
                code: RISK_DECLINED
                detail: >-
                  The payment was declined by the merchant's risk policy before dispatch.
                  Velocity limit maxPerCardPerHour=5 was exceeded for this payment method
                  reference.
                category: BUSINESS_RULE
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: paymentMethod.token
                    code: VELOCITY_EXCEEDED
                    message: 'Rule L5.VELOCITY_PER_CARD_PER_HOUR: 6 > 5.'
                docsUrl: https://docs.example.com/errors/RISK_DECLINED
            refundExceedsCaptured:
              summary: REFUND_EXCEEDS_CAPTURED
              description: |
                Invariant I1: the cumulative refunded total may never exceed the captured
                total. Enforced in the aggregate, by a database `CHECK`, and by a serialized
                update of the payment row.
              value:
                type: https://errors.example.com/REFUND_EXCEEDS_CAPTURED
                title: Refund exceeds the captured amount
                status: 422
                code: REFUND_EXCEEDS_CAPTURED
                detail: >-
                  Requested refund of 40000 USD plus 30000 USD already refunded exceeds the
                  captured total of 60000 USD on payment pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0. The
                  maximum refundable amount is 30000 USD.
                category: BUSINESS_RULE
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: amount.amount
                    code: EXCEEDS_REFUNDABLE
                    message: Maximum refundable amount is 30000 minor units.
                docsUrl: https://docs.example.com/errors/REFUND_EXCEEDS_CAPTURED
            amountExceedsLimit:
              summary: AMOUNT_EXCEEDS_LIMIT
              value:
                type: https://errors.example.com/AMOUNT_EXCEEDS_LIMIT
                title: Amount exceeds a configured limit
                status: 422
                code: AMOUNT_EXCEEDS_LIMIT
                detail: >-
                  Amount 1500000 USD exceeds the merchant's configured
                  risk.maxTransactionAmount of 1000000 USD in configuration version 7.
                category: BUSINESS_RULE
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: amount.amount
                    code: ABOVE_MAX_TRANSACTION_AMOUNT
                    message: 'Rule L5.AMOUNT_WITHIN_MERCHANT_LIMIT: 1500000 > 1000000.'
                docsUrl: https://docs.example.com/errors/AMOUNT_EXCEEDS_LIMIT
            configurationInvalid:
              summary: CONFIGURATION_INVALID
              value:
                type: https://errors.example.com/CONFIGURATION_INVALID
                title: Configuration document is invalid
                status: 422
                code: CONFIGURATION_INVALID
                detail: 'L4 validation rejected the document: 1 rule failed.'
                category: VALIDATION
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: routing.primary
                    code: GATEWAY_NOT_CERTIFIED
                    message: >-
                      Rule L4.ROUTING_PRIMARY_IS_CERTIFIED - gateway "adyen" has no CERTIFIED
                      production connection for this merchant.
                docsUrl: https://docs.example.com/errors/CONFIGURATION_INVALID
    TooManyRequests:
      description: |
        The caller exceeded a rate limit or a concurrency bulkhead. Retryable after
        `Retry-After`; back off with jitter rather than retrying in lockstep.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              summary: RATE_LIMITED
              value:
                type: https://errors.example.com/RATE_LIMITED
                title: Rate limit exceeded
                status: 429
                code: RATE_LIMITED
                detail: >-
                  Merchant mrc_01JB8Z11111111111111111111 exceeded 300 requests per second on
                  POST /v1/payments. Retry after 1 second with jitter.
                category: RATE_LIMIT
                retryable: true
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/RATE_LIMITED
    InternalServerError:
      description: |
        An unexpected internal failure. Not retryable - the platform pages on these and the
        cause is ours, not the caller's. Quote `requestId` when reporting it.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              summary: INTERNAL_ERROR
              value:
                type: https://errors.example.com/INTERNAL_ERROR
                title: Internal error
                status: 500
                code: INTERNAL_ERROR
                detail: An unexpected error occurred. This incident has been recorded.
                category: INTERNAL
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/INTERNAL_ERROR
    BadGateway:
      description: |
        The gateway responded, but the response failed L6 validation - bad signature, schema
        violation, or an amount/currency echo that does not match what we sent. **Not
        retryable.** The gateway did answer, so it may already have moved money, and the
        payment has been left for reconciliation rather than applied. Poll
        `GET /v1/payments/{paymentId}`; re-issuing under a fresh idempotency key against a
        gateway that has just mis-reported an outcome is the double-charge path.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gatewayContractViolation:
              summary: GATEWAY_CONTRACT_VIOLATION
              value:
                type: https://errors.example.com/GATEWAY_CONTRACT_VIOLATION
                title: Gateway response violated its contract
                status: 502
                code: GATEWAY_CONTRACT_VIOLATION
                detail: >-
                  Gateway stripe echoed currency "usd" and amount 1005 for a request of 1050
                  USD. The response was rejected and the payment left for reconciliation.
                  Poll the payment; do not resubmit with a new idempotency key.
                category: GATEWAY
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: amount
                    code: ECHO_MISMATCH
                    message: 'Sent 1050, echoed 1005.'
                docsUrl: https://docs.example.com/errors/GATEWAY_CONTRACT_VIOLATION
    ServiceUnavailable:
      description: |
        The platform cannot serve this request right now and fails closed rather than
        degrading correctness. Retryable after `Retry-After`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEligibleGateway:
              summary: NO_ELIGIBLE_GATEWAY
              description: |
                Routing produced an empty candidate list. Every excluded gateway is recorded
                with its exclusion reason in the persisted routing plan, which is the question
                asked in every routing incident. Failing closed is deliberate: processing a
                payment through a gateway the merchant is not certified for is worse than
                rejecting it.
              value:
                type: https://errors.example.com/NO_ELIGIBLE_GATEWAY
                title: No eligible gateway
                status: 503
                code: NO_ELIGIBLE_GATEWAY
                detail: >-
                  No gateway can process EUR CARD for merchant mrc_01JB8Z11111111111111111111
                  right now. Routing plan rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE records why each
                  candidate was excluded.
                category: INFRASTRUCTURE
                retryable: true
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: routing.candidates.adyen
                    code: CIRCUIT_OPEN
                    message: Circuit OPEN for (adyen, AUTHORIZE) in eu-central-1 since 14:04:31Z.
                  - field: routing.candidates.stripe
                    code: CURRENCY_UNSUPPORTED
                    message: Connection gwc_01JB8Z88888888888888888888 is not enabled for EUR.
                docsUrl: https://docs.example.com/errors/NO_ELIGIBLE_GATEWAY
            serviceUnavailable:
              summary: SERVICE_UNAVAILABLE
              value:
                type: https://errors.example.com/SERVICE_UNAVAILABLE
                title: Service temporarily unavailable
                status: 503
                code: SERVICE_UNAVAILABLE
                detail: >-
                  The regional primary database is unreachable. Payment writes fail closed
                  under partition rather than risking a divergent money state.
                category: INFRASTRUCTURE
                retryable: true
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                docsUrl: https://docs.example.com/errors/SERVICE_UNAVAILABLE
    GatewayTimeout:
      description: |
        The gateway did not respond within the hard timeout. **The outcome is ambiguous.** The
        payment stays `PROCESSING`, the attempt is `TIMEOUT_UNKNOWN` and a reconciler resolves
        it. Do **not** re-issue the payment under a new idempotency key: poll
        `GET /v1/payments/{paymentId}` instead. Retrying with the *same* key is safe.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gatewayTimeout:
              summary: GATEWAY_TIMEOUT
              value:
                type: https://errors.example.com/GATEWAY_TIMEOUT
                title: Gateway timed out
                status: 504
                code: GATEWAY_TIMEOUT
                detail: >-
                  Gateway adyen did not respond within 8000 ms. Payment
                  pay_01JB8ZSSSSSSSSSSSSSSSSSSSS remains PROCESSING and attempt
                  att_01JB8ZHHHHHHHHHHHHHHHHHHHH is TIMEOUT_UNKNOWN. Poll the payment; do not
                  resubmit with a new idempotency key.
                category: TIMEOUT
                retryable: false
                requestId: req_01JB8Z22222222222222222222
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - field: paymentId
                    code: RECONCILIATION_QUEUED
                    message: Resolution deadline 2026-08-27T14:03:11.001Z.
                docsUrl: https://docs.example.com/errors/GATEWAY_TIMEOUT
  schemas:
    Ulid:
      type: string
      title: Prefixed ULID
      description: |
        `<prefix>_<26-char Crockford Base32 ULID>`. Time-ordered, collision-resistant,
        non-guessable, and self-describing in logs. **Opaque to clients** - no client may
        parse one, and the platform reserves the right to change the encoding behind the
        prefix.
      pattern: '^[a-z]{2,4}_[0-9A-Z]{26}$'
      maxLength: 32
      example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
    TenantId:
      type: string
      description: Tenant identifier. Derived from the access token, never accepted in a request body.
      pattern: '^ten_[0-9A-Z]{26}$'
      example: ten_01JB8Z00000000000000000000
    MerchantId:
      type: string
      description: Merchant identifier.
      pattern: '^mrc_[0-9A-Z]{26}$'
      example: mrc_01JB8Z11111111111111111111
    PaymentId:
      type: string
      description: Payment identifier.
      pattern: '^pay_[0-9A-Z]{26}$'
      example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
    AttemptId:
      type: string
      description: Payment attempt identifier.
      pattern: '^att_[0-9A-Z]{26}$'
      example: att_01JB8Z44444444444444444444
    RefundId:
      type: string
      description: Refund identifier.
      pattern: '^ref_[0-9A-Z]{26}$'
      example: ref_01JB8ZGGGGGGGGGGGGGGGGGGGG
    RoutingPlanId:
      type: string
      description: Routing plan identifier.
      pattern: '^rpl_[0-9A-Z]{26}$'
      example: rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE
    GatewayId:
      type: string
      description: >-
        Gateway identifier: a stable, human-authored slug such as `stripe` or `adyen`, not a
        generated ULID. It is the same value as `gatewayCode`; the contract carries both because
        older clients read one and newer ones read the other, and inventing a second identifier
        so the two differ would be a lie the reconciler would then have to resolve.
      pattern: '^[a-z][a-z0-9-]{0,31}$'
      example: stripe
    ConnectionId:
      type: string
      description: Gateway connection identifier - the binding of one merchant to one gateway.
      pattern: '^gwc_[0-9A-Z]{26}$'
      example: gwc_01JB8Z88888888888888888888
    OnboardingCaseId:
      type: string
      description: Onboarding case identifier.
      pattern: '^onb_[0-9A-Z]{26}$'
      example: onb_01JB8Z66666666666666666666
    WorkflowInstanceId:
      type: string
      description: Workflow instance identifier.
      pattern: '^wfr_[0-9A-Z]{26}$'
      example: wfr_01JB8ZMMMMMMMMMMMMMMMMMMMM
    WorkflowStepId:
      type: string
      description: Workflow step identifier.
      pattern: '^wfs_[0-9A-Z]{26}$'
      example: wfs_01JB8ZNNNNNNNNNNNNNNNNNNNN
    ConfigurationVersionId:
      type: string
      description: Configuration version identifier.
      pattern: '^cfv_[0-9A-Z]{26}$'
      example: cfv_01JB8ZCCCCCCCCCCCCCCCCCCCC
    CurrencyCode:
      type: string
      title: ISO 4217 alphabetic currency code
      description: |
        Uppercase ISO 4217 alphabetic code. The minor-unit exponent comes from an embedded
        ISO 4217 table (`USD`=2, `JPY`=0, `BHD`=3, `CLF`=4) and is never inferred from the
        amount.
      pattern: '^[A-Z]{3}$'
      example: USD
    CountryCode:
      type: string
      title: ISO 3166-1 alpha-2 country code
      pattern: '^[A-Z]{2}$'
      example: DE
    Money:
      type: object
      title: Money
      description: |
        An amount in the currency's **minor units** plus its ISO 4217 code.

        `{"amount": 1050, "currency": "USD"}` is USD 10.50. This is never a float and never a
        decimal string: `float64` cannot represent 0.10, and a decimal string invites the
        parsing bug it was meant to avoid. Arithmetic across differing currencies is an error,
        never a silent conversion. Splitting uses largest-remainder allocation so the parts
        always sum to the whole.

        The API rejects `amount <= 0` on every request. Negative amounts are legal only for
        ledger credit entries, which are not part of this surface.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in minor units of `currency`. Integer, always.
          example: 1050
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      example:
        amount: 1050
        currency: USD
    PositiveMoney:
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: integer
              format: int64
              minimum: 1
              description: Must be strictly positive on every request.
      title: Positive money
      description: Money constrained to a strictly positive amount, for request bodies.
      example:
        amount: 1050
        currency: USD
    Sha256Hex:
      type: string
      description: Lowercase hexadecimal SHA-256 digest.
      pattern: '^[0-9a-f]{64}$'
      example: 3a7f9c1e5b2d4a6f8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4c
    Problem:
      type: object
      title: Problem details (RFC 9457)
      description: |
        Every error response is `application/problem+json` shaped like this. The extensions
        beyond RFC 9457 are `code`, `category`, `retryable`, `requestId`, `traceId`,
        `details` and `docsUrl`.

        `retryable` is machine-readable and is what client SDKs, the workflow engine and the
        outbox relay branch on. It is not advisory prose. `502`, `503` and `504` are
        retryable; `4xx` other than `409 IDEMPOTENT_REQUEST_IN_PROGRESS` and `429` are not.
      required: [type, title, status, code, category, retryable, requestId, traceId]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the error class. Dereferenceable to documentation.
          example: https://errors.example.com/REFUND_EXCEEDS_CAPTURED
        title:
          type: string
          description: Short, human-readable summary. Stable for a given `code`; never parameterised.
          example: Refund exceeds the captured amount
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code, duplicated here so the body is self-contained in logs.
          example: 422
        code:
          type: string
          description: |
            The platform error code from `api/errors/catalog.yaml`. This, not `title` or
            `status`, is what clients branch on.
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          example: REFUND_EXCEEDS_CAPTURED
        detail:
          type: string
          description: |
            Human-readable, instance-specific explanation. Contains identifiers and amounts,
            never cardholder data, credentials or personal data.
          example: Requested refund exceeds the captured total on this payment.
        instance:
          type: string
          format: uri-reference
          description: URI reference of the specific occurrence, usually the request path.
          example: /v1/payments/pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0/refund
        category:
          $ref: '#/components/schemas/ErrorCategory'
        retryable:
          type: boolean
          description: |
            Whether retrying the identical request with the same idempotency key can succeed.
            Machine-readable contract, not advice.
          example: false
        requestId:
          type: string
          description: The request identifier, matching the `X-Request-Id` response header.
          example: req_01JB8Z22222222222222222222
        traceId:
          type: string
          description: W3C trace id of the request, for correlating with traces and logs.
          pattern: '^[0-9a-f]{32}$'
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        details:
          type: array
          description: |
            Field-level breakdown. Present whenever the error can be attributed to specific
            inputs; absent for infrastructure errors.
          items:
            $ref: '#/components/schemas/ProblemDetailItem'
        docsUrl:
          type: string
          format: uri
          description: Documentation anchor for this code, including remediation.
          example: https://docs.example.com/errors/REFUND_EXCEEDS_CAPTURED
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 0
          description: Mirrors the `Retry-After` header when one is set.
          example: 1
      example:
        type: https://errors.example.com/PAYMENT_ALREADY_PROCESSED
        title: Payment has already been processed
        status: 409
        code: PAYMENT_ALREADY_PROCESSED
        detail: Payment pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0 is in state CAPTURED and cannot be captured again
        category: BUSINESS_RULE
        retryable: false
        requestId: req_01JB8Z22222222222222222222
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        details:
          - field: amount
            code: EXCEEDS_CAPTURABLE
            message: No capturable balance remains on this authorization.
        docsUrl: https://docs.example.com/errors/PAYMENT_ALREADY_PROCESSED
    ProblemDetailItem:
      type: object
      title: Field-level problem detail
      description: One attributable cause within a problem document.
      required: [code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON pointer-ish dotted path to the offending field, where one applies.
          example: amount.amount
        code:
          type: string
          description: Stable sub-code, typically a validation rule identifier.
          pattern: '^[A-Z][A-Z0-9_.]{2,63}$'
          example: EXCEEDS_REFUNDABLE
        message:
          type: string
          description: Human-readable explanation. Never contains cardholder data or secrets.
          example: Maximum refundable amount is 30000 minor units.
        ruleId:
          type: string
          description: |
            Validation-plane rule identifier, e.g. `L5.AMOUNT_WITHIN_MERCHANT_LIMIT`. Every
            rule id is documented with its meaning and remediation.
          example: L5.AMOUNT_WITHIN_MERCHANT_LIMIT
      example:
        field: amount.amount
        code: EXCEEDS_REFUNDABLE
        message: Maximum refundable amount is 30000 minor units.
        ruleId: L5.REFUND_WITHIN_CAPTURED
    ErrorCategory:
      type: string
      title: Error category
      description: |
        Coarse classification driving HTTP status, gRPC code, retryability and alerting.
      enum:
        - VALIDATION
        - AUTHENTICATION
        - AUTHORIZATION
        - NOT_FOUND
        - CONFLICT
        - BUSINESS_RULE
        - RATE_LIMIT
        - GATEWAY
        - TIMEOUT
        - INFRASTRUCTURE
        - INTERNAL
      example: BUSINESS_RULE
    PageMeta:
      type: object
      title: Cursor pagination envelope fields
      description: |
        Shared shape of every list response: `{"data": [...], "next_cursor": null}`.
        `next_cursor` is `null` on the last page - it is never omitted, so a client can branch
        on presence without a key check.
      required: [data, next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or `null` when this is the last page.
          maxLength: 512
          example: eyJrIjoicGF5XzAxSkI4WjlLMlFXM0U0UjVUNlk3VThJOU8wIn0
    MerchantPage:
      type: object
      title: Page of merchants
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Merchant'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or `null` on the last page.
          example: null
      example:
        data: []
        next_cursor: null
    PaymentPage:
      type: object
      title: Page of payments
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        next_cursor:
          type: [string, 'null']
          example: eyJrIjoicGF5XzAxSkI4WjlLMlFXM0U0UjVUNlk3VThJOU8wIn0
      example:
        data: []
        next_cursor: null
    GatewayPage:
      type: object
      title: Page of gateways
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Gateway'
        next_cursor:
          type: [string, 'null']
          example: null
      example:
        data: []
        next_cursor: null
    ConfigurationVersionPage:
      type: object
      title: Page of configuration versions
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationVersion'
        next_cursor:
          type: [string, 'null']
          example: null
      example:
        data: []
        next_cursor: null
    MerchantStatus:
      type: string
      title: Merchant lifecycle state
      description: |
        The 20 states of the merchant FSM. Transitions absent from the transition table are
        rejected with `INVALID_STATE_TRANSITION`.

        `COMPLIANCE_REJECTED` exists so that a compliance officer's rejection at the manual
        gate is representable. Without it the workflow would have to either lie
        (`CERTIFICATION_FAILED`, blaming the integration for a policy decision) or hang. It is
        non-terminal and routes back to `CONFIGURING` (fixable configuration) or
        `KYC_PENDING` (fixable evidence), or forward to `TERMINATED`.
      enum:
        - CREATED
        - VALIDATING
        - VALIDATION_FAILED
        - KYC_PENDING
        - KYC_APPROVED
        - KYC_FAILED
        - BANK_VALIDATED
        - BANK_VALIDATION_FAILED
        - GATEWAY_PROVISIONING
        - PROVISIONING_FAILED
        - CONFIGURING
        - CONFIGURATION_FAILED
        - SANDBOX_VALIDATION
        - CERTIFICATION
        - CERTIFICATION_FAILED
        - COMPLIANCE_REJECTED
        - APPROVED
        - PRODUCTION_READY
        - ACTIVE
        - SUSPENDED
        - TERMINATED
      example: ACTIVE
    EntityType:
      type: string
      title: Legal entity type
      enum:
        - SOLE_TRADER
        - PARTNERSHIP
        - PRIVATE_LIMITED
        - PUBLIC_LIMITED
        - NON_PROFIT
        - TRUST
        - GOVERNMENT
      example: PRIVATE_LIMITED
    BankAccountScheme:
      type: string
      title: Bank account scheme
      enum: [SEPA, ACH, FPS, SWIFT]
      example: SEPA
    BusinessProfile:
      type: object
      title: Business profile
      description: |
        The merchant's legal identity as declared at signup and verified during KYB. One per
        merchant. Written in the same transaction as the merchant row and under the same
        version check.
      required:
        - legalName
        - entityType
        - registrationNumber
        - incorporationCountry
        - mcc
        - declaredMonthlyVolume
      additionalProperties: false
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 256
          description: Registered legal name, exactly as it appears on the incorporation record.
          example: Acme Handels GmbH
        tradingName:
          type: string
          maxLength: 256
          description: Trading or "doing business as" name, when it differs from the legal name.
          example: Acme
        entityType:
          $ref: '#/components/schemas/EntityType'
        registrationNumber:
          type: string
          minLength: 1
          maxLength: 64
          description: Company registration number in the incorporation country's registry.
          example: HRB 214592
        taxId:
          type: string
          maxLength: 64
          description: VAT or tax identification number.
          example: DE811907980
        incorporationCountry:
          $ref: '#/components/schemas/CountryCode'
        mcc:
          type: string
          pattern: '^[0-9]{4}$'
          description: |
            ISO 18245 merchant category code. Drives risk policy, gateway eligibility and
            prohibited-category checks.
          example: '5812'
        declaredMonthlyVolume:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Self-declared expected monthly processing volume. A risk and gateway-selection
            input, and the baseline against which observed volume anomalies are measured.
        websiteUrl:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Primary customer-facing website. Reachability is checked by L2 rule
            `L2.WEBSITE_NOT_REACHABLE`, whose failure is a warning, not a blocker.
          example: https://acme.example
        supportEmail:
          type: string
          format: email
          maxLength: 254
          example: support@acme.example
        supportPhone:
          type: string
          maxLength: 32
          example: '+49 30 123456'
      example:
        legalName: Acme Handels GmbH
        tradingName: Acme
        entityType: PRIVATE_LIMITED
        registrationNumber: HRB 214592
        taxId: DE811907980
        incorporationCountry: DE
        mcc: '5812'
        declaredMonthlyVolume: { amount: 25000000, currency: EUR }
        websiteUrl: https://acme.example
        supportEmail: support@acme.example
    BankAccount:
      type: object
      title: Bank account
      description: |
        A settlement destination. **The full account number is never stored, returned or
        logged** - only the last four digits, the holder name, the country, the currency and
        the scheme. The account number is submitted once, validated through the bank
        validation port, and discarded.

        Exactly one `PRIMARY` account per settlement currency.
      required: [id, maskedAccount, holderName, country, currency, scheme, isPrimary, validationState]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ba_[0-9A-Z]{26}$'
          description: Bank account identifier.
          example: ba_01JB8Z77777777777777777777
        maskedAccount:
          type: string
          pattern: '^\*{4}[0-9]{4}$'
          description: |
            Last four digits only, masked. There is no field on this API that carries a full
            account number in a response - not redacted, not encrypted, absent.
          example: '****4471'
        holderName:
          type: string
          maxLength: 256
          description: Account holder name as held by the bank.
          example: Acme Handels GmbH
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scheme:
          $ref: '#/components/schemas/BankAccountScheme'
        isPrimary:
          type: boolean
          description: Whether this is the primary settlement account for its currency.
          example: true
        validationState:
          type: string
          enum: [UNVALIDATED, VALIDATING, VALIDATED, FAILED]
          description: Outcome of the bank validation port.
          example: VALIDATED
        nameMatch:
          type: string
          enum: [EXACT, CLOSE, NONE]
          description: |
            Confirmation-of-payee result. `NONE` does not automatically fail onboarding but
            does require an operator decision.
          example: EXACT
        validatedAt:
          type: string
          format: date-time
          example: '2026-08-27T13:02:55.117Z'
      example:
        id: ba_01JB8Z77777777777777777777
        maskedAccount: '****4471'
        holderName: Acme Handels GmbH
        country: DE
        currency: EUR
        scheme: SEPA
        isPrimary: true
        validationState: VALIDATED
        nameMatch: EXACT
        validatedAt: '2026-08-27T13:02:55.117Z'
    BankAccountInput:
      type: object
      title: Bank account submission
      description: |
        Write-side shape. `accountNumber` and `routingIdentifier` are accepted once, used for
        validation, and never returned by any read. They are `Secret`-wrapped internally and
        serialize to `[REDACTED]` in logs and events.
      required: [holderName, country, currency, scheme, accountNumber]
      additionalProperties: false
      properties:
        holderName:
          type: string
          maxLength: 256
          example: Acme Handels GmbH
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scheme:
          $ref: '#/components/schemas/BankAccountScheme'
        accountNumber:
          type: string
          minLength: 4
          maxLength: 34
          description: |
            IBAN or domestic account number. Write-only: never echoed in a response, never
            logged, never published in an event.
          writeOnly: true
          example: DE89370400440532013000
        routingIdentifier:
          type: string
          maxLength: 34
          description: BIC, sort code or ABA routing number, where the scheme requires one.
          writeOnly: true
          example: COBADEFFXXX
        isPrimary:
          type: boolean
          default: false
          description: Make this the primary settlement account for its currency.
          example: true
      example:
        holderName: Acme Handels GmbH
        country: DE
        currency: EUR
        scheme: SEPA
        accountNumber: DE89370400440532013000
        routingIdentifier: COBADEFFXXX
        isPrimary: true
    Principal:
      type: object
      title: Merchant principal
      description: |
        A director, officer or ultimate beneficial owner of the merchant. Personal data here
        is stored in the tenant's declared residency region and is retained for at least five
        years under the AML legal-obligation basis.

        KYC **evidence** is never carried on this object - only the vendor's case reference
        and an object-storage URI under Object Lock.
      required: [id, firstName, lastName, role, isUbo, country, verificationState]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^prn_[0-9A-Z]{26}$'
          description: Principal identifier.
          example: prn_01JB8ZTTTTTTTTTTTTTTTTTTTT
        firstName:
          type: string
          maxLength: 128
          example: Anja
        lastName:
          type: string
          maxLength: 128
          example: Weber
        dateOfBirth:
          type: string
          format: date
          description: Write-side only for KYC submission; masked to the year on read.
          example: '1979-04-12'
        role:
          type: string
          enum: [DIRECTOR, OFFICER, SHAREHOLDER, TRUSTEE, AUTHORIZED_SIGNATORY]
          example: DIRECTOR
        isUbo:
          type: boolean
          description: |
            Whether this principal is an ultimate beneficial owner. At least one UBO must
            exist before the merchant may enter `KYC_PENDING`.
          example: true
        ownershipPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            Beneficial ownership share. The sum across all UBOs may not exceed 100.
          example: 60
        country:
          $ref: '#/components/schemas/CountryCode'
        verificationState:
          type: string
          enum: [UNVERIFIED, PENDING, VERIFIED, FAILED, REVIEW]
          description: Per-principal KYC outcome as reported by the vendor.
          example: VERIFIED
        kycReference:
          type: string
          maxLength: 128
          description: |
            The vendor's case reference. **Never the decision evidence and never PII** - it is
            a pointer, and the evidence lives in Object-Locked storage.
          example: kyc-8f21ba
        isPep:
          type: boolean
          description: |
            Politically exposed person flag as reported by the KYC vendor. A `true` value
            requires a recorded enhanced-due-diligence decision before onboarding proceeds.
          example: false
      example:
        id: prn_01JB8ZTTTTTTTTTTTTTTTTTTTT
        firstName: Anja
        lastName: Weber
        role: DIRECTOR
        isUbo: true
        ownershipPercentage: 60
        country: DE
        verificationState: VERIFIED
        kycReference: kyc-8f21ba
        isPep: false
    Merchant:
      type: object
      title: Merchant
      description: |
        A business onboarded under a tenant that submits payment instructions. The merchant
        row is the concurrency point for all child mutations: adding a bank account bumps the
        version, so a concurrent status transition loses and retries.

        Payments, gateway connections and configuration are **not** part of this aggregate.
        They are referenced by identifier and read through their own endpoints.
      required: [id, tenantId, displayName, status, residencyRegion, businessProfile, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/MerchantId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        externalReference:
          type: string
          maxLength: 128
          description: |
            The tenant's own identifier for this merchant. Unique within the tenant when
            present, so it can be used as a lookup key by an integrating system.
          example: acme-eu-01
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          example: Acme GmbH
        status:
          $ref: '#/components/schemas/MerchantStatus'
        statusReason:
          type: string
          maxLength: 512
          description: |
            Why the merchant is in its current state. Populated on failure and suspension
            states; carries the reviewer's reason code for `COMPLIANCE_REJECTED`.
          example: Attestation expired 2026-08-26
        residencyRegion:
          type: string
          maxLength: 32
          description: |
            Where this merchant's personal data may live. The routing engine will not select
            a gateway whose region violates it.
          example: eu-central-1
        businessProfile:
          $ref: '#/components/schemas/BusinessProfile'
        bankAccounts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BankAccount'
        principals:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/Principal'
        certificationReportId:
          type: string
          maxLength: 32
          description: |
            The passing certification report backing this merchant's production readiness.
            `PRODUCTION_READY` is unreachable without one.
          example: rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA
        activeConfigurationVersion:
          type: integer
          format: int32
          minimum: 1
          description: Version number of the currently active configuration document.
          example: 7
        activatedAt:
          type: string
          format: date-time
          example: '2026-08-27T19:00:00.512Z'
        suspendedAt:
          type: [string, 'null']
          format: date-time
          example: null
        terminatedAt:
          type: [string, 'null']
          format: date-time
          example: null
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic concurrency version. Echoed as the `ETag`.
          example: 14
        createdAt:
          type: string
          format: date-time
          example: '2026-08-26T09:04:11.002Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-08-27T19:00:00.512Z'
      example:
        id: mrc_01JB8Z11111111111111111111
        tenantId: ten_01JB8Z00000000000000000000
        externalReference: acme-eu-01
        displayName: Acme GmbH
        status: ACTIVE
        residencyRegion: eu-central-1
        businessProfile:
          legalName: Acme Handels GmbH
          tradingName: Acme
          entityType: PRIVATE_LIMITED
          registrationNumber: HRB 214592
          incorporationCountry: DE
          mcc: '5812'
          declaredMonthlyVolume: { amount: 25000000, currency: EUR }
          websiteUrl: https://acme.example
        bankAccounts:
          - id: ba_01JB8Z77777777777777777777
            maskedAccount: '****4471'
            holderName: Acme Handels GmbH
            country: DE
            currency: EUR
            scheme: SEPA
            isPrimary: true
            validationState: VALIDATED
            nameMatch: EXACT
            validatedAt: '2026-08-27T13:02:55.117Z'
        principals:
          - id: prn_01JB8ZTTTTTTTTTTTTTTTTTTTT
            firstName: Anja
            lastName: Weber
            role: DIRECTOR
            isUbo: true
            ownershipPercentage: 60
            country: DE
            verificationState: VERIFIED
            kycReference: kyc-8f21ba
            isPep: false
        certificationReportId: rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA
        activeConfigurationVersion: 7
        activatedAt: '2026-08-27T19:00:00.512Z'
        version: 14
        createdAt: '2026-08-26T09:04:11.002Z'
        updatedAt: '2026-08-27T19:00:00.512Z'
    CreateMerchantRequest:
      type: object
      title: Create merchant request
      description: |
        Registers a merchant in state `CREATED`. The tenant is taken from the access token; a
        `tenantId` here is rejected.
      required: [displayName, residencyRegion, businessProfile]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          example: Acme GmbH
        externalReference:
          type: string
          maxLength: 128
          description: The tenant's own identifier. Must be unique within the tenant.
          example: acme-eu-01
        residencyRegion:
          type: string
          maxLength: 32
          description: Declared data-residency region. Immutable after creation.
          example: eu-central-1
        businessProfile:
          $ref: '#/components/schemas/BusinessProfile'
        bankAccounts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BankAccountInput'
        principals:
          type: array
          maxItems: 25
          description: |
            Directors, officers and UBOs. At least one UBO is required before onboarding may
            enter `KYC_PENDING`, but not at creation time.
          items:
            $ref: '#/components/schemas/PrincipalInput'
        selectedGateways:
          type: array
          maxItems: 8
          description: Gateway codes the merchant wishes to be provisioned on.
          items:
            $ref: '#/components/schemas/GatewayCode'
          example: [adyen, stripe]
      example:
        displayName: Acme GmbH
        externalReference: acme-eu-01
        residencyRegion: eu-central-1
        businessProfile:
          legalName: Acme Handels GmbH
          tradingName: Acme
          entityType: PRIVATE_LIMITED
          registrationNumber: HRB 214592
          incorporationCountry: DE
          mcc: '5812'
          declaredMonthlyVolume: { amount: 25000000, currency: EUR }
          websiteUrl: https://acme.example
        bankAccounts:
          - holderName: Acme Handels GmbH
            country: DE
            currency: EUR
            scheme: SEPA
            accountNumber: DE89370400440532013000
            isPrimary: true
        selectedGateways: [adyen, stripe]
    PrincipalInput:
      type: object
      title: Principal submission
      required: [firstName, lastName, role, isUbo, country]
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 128
          example: Anja
        lastName:
          type: string
          maxLength: 128
          example: Weber
        dateOfBirth:
          type: string
          format: date
          writeOnly: true
          example: '1979-04-12'
        role:
          type: string
          enum: [DIRECTOR, OFFICER, SHAREHOLDER, TRUSTEE, AUTHORIZED_SIGNATORY]
          example: DIRECTOR
        isUbo:
          type: boolean
          example: true
        ownershipPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 60
        country:
          $ref: '#/components/schemas/CountryCode'
      example:
        firstName: Anja
        lastName: Weber
        dateOfBirth: '1979-04-12'
        role: DIRECTOR
        isUbo: true
        ownershipPercentage: 60
        country: DE
    UpdateMerchantRequest:
      type: object
      title: Update merchant request
      description: |
        Merge-patch of the merchant's mutable attributes. Lifecycle state, tenant, residency
        region and identifiers are not mutable here.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          example: Acme GmbH
        externalReference:
          type: [string, 'null']
          maxLength: 128
          description: Set to `null` to clear.
          example: acme-eu-02
        businessProfile:
          $ref: '#/components/schemas/BusinessProfile'
        bankAccounts:
          type: array
          maxItems: 20
          description: Full replacement of the bank account set.
          items:
            $ref: '#/components/schemas/BankAccountInput'
        principals:
          type: array
          maxItems: 25
          description: Full replacement of the principal set.
          items:
            $ref: '#/components/schemas/PrincipalInput'
      example:
        displayName: Acme Europe GmbH
        businessProfile:
          legalName: Acme Handels GmbH
          entityType: PRIVATE_LIMITED
          registrationNumber: HRB 214592
          incorporationCountry: DE
          mcc: '5812'
          declaredMonthlyVolume: { amount: 40000000, currency: EUR }
    OnboardingStepKey:
      type: string
      title: Onboarding step key
      description: The twelve steps of workflow `merchant-onboarding@v1`, in order.
      enum:
        - validate-merchant
        - submit-kyc
        - await-kyc-decision
        - validate-bank-account
        - provision-gateways
        - store-credentials
        - register-webhooks
        - apply-configuration
        - sandbox-validation
        - certification
        - compliance-review
        - activate
      example: compliance-review
    OnboardingStepState:
      type: string
      title: Onboarding step state
      enum: [PENDING, RUNNING, WAITING_SIGNAL, SUCCEEDED, FAILED, COMPENSATING, COMPENSATED, SKIPPED]
      example: WAITING_SIGNAL
    OnboardingCaseStatus:
      type: string
      title: Onboarding case status
      description: |
        `OPEN <-> BLOCKED -> COMPLETED | ABANDONED`. Exactly one non-terminal case may exist
        per merchant.
      enum: [OPEN, BLOCKED, COMPLETED, ABANDONED]
      example: OPEN
    OnboardingSignalName:
      type: string
      title: Workflow signal name
      enum: [kyc-decision, compliance-approval, gateway-consent]
      example: compliance-approval
    Annotation:
      type: object
      title: Validation annotation
      description: |
        A validation-plane outcome attached to the case. `WARNING` severity does not block the
        workflow; `ERROR` does.
      required: [ruleId, severity, message]
      additionalProperties: false
      properties:
        ruleId:
          type: string
          description: Stable validation rule identifier.
          example: L2.WEBSITE_NOT_REACHABLE
        severity:
          type: string
          enum: [ERROR, WARNING]
          example: WARNING
        message:
          type: string
          maxLength: 1024
          example: https://acme.example returned 503
        annotatedAt:
          type: string
          format: date-time
          example: '2026-08-26T09:12:04.221Z'
      example:
        ruleId: L2.WEBSITE_NOT_REACHABLE
        severity: WARNING
        message: https://acme.example returned 503
        annotatedAt: '2026-08-26T09:12:04.221Z'
    OnboardingStep:
      type: object
      title: Onboarding step
      description: |
        One step of the durable workflow. Every step's result is checkpointed before the next
        begins; resuming an instance replays no completed step. A step that exhausts its
        retries moves the instance to `FAILED` and its payload to the workflow DLQ with the
        full error chain.
      required: [id, key, sequence, state, attemptCount]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/WorkflowStepId'
        key:
          $ref: '#/components/schemas/OnboardingStepKey'
        sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: Position in the workflow definition.
          example: 11
        state:
          $ref: '#/components/schemas/OnboardingStepState'
        attemptCount:
          type: integer
          format: int32
          minimum: 0
          description: How many times the activity has been attempted.
          example: 1
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          description: Retry budget from the workflow definition.
          example: 1
        timeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Step timeout from the workflow definition. 432000 for the 5-day compliance gate.
          example: 432000
        awaitingSignal:
          type: [string, 'null']
          description: |
            The signal this step is blocked on, when it is a `SignalStep`. A signal step holds
            **no** worker lease - a 5-day compliance review costs no worker resource.
          example: compliance-approval
        compensationState:
          type: string
          enum: [NOT_REQUIRED, PENDING, RUNNING, DONE, FAILED]
          description: |
            Compensation status. On abort, compensations run in strict reverse order of
            completion.
          example: NOT_REQUIRED
        startedAt:
          type: string
          format: date-time
          example: '2026-08-27T18:45:02.114Z'
        endedAt:
          type: [string, 'null']
          format: date-time
          example: null
        errorCode:
          type: string
          description: Normalized error code from the catalogue, when the step failed.
          example: WORKFLOW_STEP_FAILED
        errorMessage:
          type: string
          maxLength: 2048
          description: Human-readable failure summary. Never contains secrets or personal data.
          example: KYC provider returned HTTP 503 after 5 attempts.
      example:
        id: wfs_01JB8ZNNNNNNNNNNNNNNNNNNNN
        key: compliance-review
        sequence: 11
        state: WAITING_SIGNAL
        attemptCount: 0
        maxAttempts: 1
        timeoutSeconds: 432000
        awaitingSignal: compliance-approval
        compensationState: NOT_REQUIRED
        startedAt: '2026-08-27T18:45:02.114Z'
        endedAt: null
    OnboardingCase:
      type: object
      title: Onboarding case
      description: |
        The stateful record of one merchant's journey from `CREATED` to `ACTIVE`, backed by
        exactly one workflow instance. The case *requests* merchant status transitions; the
        merchant aggregate *decides* them. Conflating the two would let the automation plane
        bypass the merchant FSM guards.
      required: [id, merchantId, workflowInstanceId, status, currentStepKey, steps, openedAt, version]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OnboardingCaseId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        workflowInstanceId:
          $ref: '#/components/schemas/WorkflowInstanceId'
        workflowName:
          type: string
          description: Workflow definition name and version.
          example: merchant-onboarding@v1
        status:
          $ref: '#/components/schemas/OnboardingCaseStatus'
        merchantStatus:
          $ref: '#/components/schemas/MerchantStatus'
        currentStepKey:
          $ref: '#/components/schemas/OnboardingStepKey'
        blockedReason:
          type: [string, 'null']
          maxLength: 512
          description: Why the case is `BLOCKED`, when it is.
          example: null
        selectedGateways:
          type: array
          items:
            $ref: '#/components/schemas/GatewayCode'
          example: [adyen, stripe]
        steps:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/OnboardingStep'
        annotations:
          type: array
          description: L2 validation outcomes attached to the case.
          items:
            $ref: '#/components/schemas/Annotation'
        certificationReport:
          oneOf:
            - $ref: '#/components/schemas/CertificationReport'
            - type: 'null'
          description: The certification report, once a run has produced one.
        slaDueAt:
          type: string
          format: date-time
          description: When the current step breaches its SLA.
          example: '2026-09-01T18:45:02.114Z'
        openedAt:
          type: string
          format: date-time
          example: '2026-08-26T09:10:00.000Z'
        closedAt:
          type: [string, 'null']
          format: date-time
          example: null
        version:
          type: integer
          format: int64
          minimum: 0
          example: 22
      example:
        id: onb_01JB8Z66666666666666666666
        merchantId: mrc_01JB8Z11111111111111111111
        workflowInstanceId: wfr_01JB8ZMMMMMMMMMMMMMMMMMMMM
        workflowName: merchant-onboarding@v1
        status: OPEN
        merchantStatus: CERTIFICATION
        currentStepKey: compliance-review
        blockedReason: null
        selectedGateways: [adyen, stripe]
        steps:
          - id: wfs_01JB8ZNNNNNNNNNNNNNNNNNNNN
            key: compliance-review
            sequence: 11
            state: WAITING_SIGNAL
            attemptCount: 0
            maxAttempts: 1
            timeoutSeconds: 432000
            awaitingSignal: compliance-approval
            compensationState: NOT_REQUIRED
            startedAt: '2026-08-27T18:45:02.114Z'
            endedAt: null
        annotations:
          - ruleId: L2.WEBSITE_NOT_REACHABLE
            severity: WARNING
            message: https://acme.example returned 503
            annotatedAt: '2026-08-26T09:12:04.221Z'
        slaDueAt: '2026-09-01T18:45:02.114Z'
        openedAt: '2026-08-26T09:10:00.000Z'
        closedAt: null
        version: 22
    StartOnboardingRequest:
      type: object
      title: Start onboarding request
      required: [selectedGateways, environment]
      additionalProperties: false
      properties:
        selectedGateways:
          type: array
          minItems: 1
          maxItems: 8
          description: |
            Gateways to provision. Step 5 fans out one provisioning branch per gateway; a
            branch that fails does not abort the others.
          items:
            $ref: '#/components/schemas/GatewayCode'
          example: [adyen, stripe]
        environment:
          $ref: '#/components/schemas/Environment'
        supportedCurrencies:
          type: array
          minItems: 1
          maxItems: 32
          description: Currencies to certify. Drives the certification matrix.
          items:
            $ref: '#/components/schemas/CurrencyCode'
          example: [EUR, USD]
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 16
          description: Payment methods to certify. Drives the certification matrix.
          items:
            $ref: '#/components/schemas/PaymentMethod'
          example: [CARD, IDEAL]
        notificationEmail:
          type: string
          format: email
          description: Where onboarding progress notifications are sent.
          example: onboarding@acme.example
      example:
        selectedGateways: [adyen, stripe]
        environment: PRODUCTION
        supportedCurrencies: [EUR, USD]
        paymentMethods: [CARD, IDEAL]
        notificationEmail: onboarding@acme.example
    OnboardingSignalRequest:
      type: object
      title: Workflow signal payload
      description: |
        The payload shape depends on the signal. `compliance-approval` carries the reviewer's
        decision, identity, reason and attestation reference - all of which are audited.
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, APPROVED, REJECTED, MORE_INFO, CONSENT_GRANTED, CONSENT_DECLINED]
          description: |
            `APPROVE`/`REJECT` for `compliance-approval`; `APPROVED`/`REJECTED`/`MORE_INFO`
            for `kyc-decision`; `CONSENT_GRANTED`/`CONSENT_DECLINED` for `gateway-consent`.
          example: APPROVE
        reviewerId:
          type: string
          maxLength: 128
          description: |
            The deciding principal. Recorded in the audit trail alongside the actor derived
            from the token; a mismatch is a dual-control violation.
          example: usr_ops_2291
        reason:
          type: string
          maxLength: 1024
          description: Justification. Required on any `REJECT` or `REJECTED` decision.
          example: Risk profile and certification report reviewed; reserve terms agreed.
        reasonCodes:
          type: array
          maxItems: 16
          description: |
            Structured reason codes for a KYC decision, e.g. `SANCTIONS_HIT`,
            `DOCUMENT_INVALID`.
          items:
            type: string
            maxLength: 64
          example: [DOCUMENT_INVALID]
        attestationRef:
          type: string
          format: uri
          description: |
            Object-storage URI of the signed compliance attestation. Required for
            `compliance-approval` with `APPROVE` - the `-> ACTIVE` guard requires a completed
            attestation to exist.
          example: s3://pp-compliance-eu/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/attestation-2026-08-27.pdf
        evidenceRef:
          type: string
          format: uri
          description: Object-storage URI of the KYC evidence, under Object Lock.
          example: s3://pp-kyc-eu/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/kyc-8f21ba.json
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
      example:
        decision: APPROVE
        reviewerId: usr_ops_2291
        reason: Risk profile and certification report reviewed; reserve terms agreed.
        attestationRef: s3://pp-compliance-eu/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/attestation-2026-08-27.pdf
    OnboardingSignalAccepted:
      type: object
      title: Signal acceptance
      required: [caseId, workflowInstanceId, signal, accepted, acceptedAt]
      additionalProperties: false
      properties:
        caseId:
          $ref: '#/components/schemas/OnboardingCaseId'
        workflowInstanceId:
          $ref: '#/components/schemas/WorkflowInstanceId'
        signal:
          $ref: '#/components/schemas/OnboardingSignalName'
        accepted:
          type: boolean
          description: |
            `true` on first delivery. Also `true` on a duplicate - the signal is idempotent
            per `(workflowInstanceId, signal)` and a redelivery is a no-op, not an error.
          example: true
        duplicate:
          type: boolean
          description: Whether this delivery was recognised as a duplicate of an earlier one.
          example: false
        auditRecordId:
          type: string
          pattern: '^aud_[0-9A-Z]{26}$'
          description: The audit record written for this signal.
          example: aud_01JB8ZKKKKKKKKKKKKKKKKKKKK
        acceptedAt:
          type: string
          format: date-time
          example: '2026-08-27T18:58:40.221Z'
      example:
        caseId: onb_01JB8Z66666666666666666666
        workflowInstanceId: wfr_01JB8ZMMMMMMMMMMMMMMMMMMMM
        signal: compliance-approval
        accepted: true
        duplicate: false
        auditRecordId: aud_01JB8ZKKKKKKKKKKKKKKKKKKKK
        acceptedAt: '2026-08-27T18:58:40.221Z'
    CertificationAssertion:
      type: object
      title: Certification assertion result
      description: |
        One of the seven mandatory assertions, evaluated for one matrix cell. There is no
        waiver flag anywhere in this model: a waiver is the mechanism by which "certified"
        degrades into an opinion.
      required: [id, description, passed]
      additionalProperties: false
      properties:
        id:
          type: string
          enum:
            - AUTH_CAPTURE_REFUND_ROUNDTRIP
            - AUTH_VOID
            - DECLINE_MAPPED
            - WEBHOOK_VERIFIED_AND_APPLIED
            - THREE_DS_CHALLENGE_COMPLETES
            - IDEMPOTENT_DUPLICATE_MATCHES
            - AMOUNT_CURRENCY_ECHO_MATCHES
          example: AUTH_CAPTURE_REFUND_ROUNDTRIP
        description:
          type: string
          maxLength: 512
          example: Authorize then capture then refund round-trip succeeds in sandbox.
        passed:
          type: boolean
          example: true
        evidenceRef:
          type: string
          format: uri
          description: Object-storage URI of the transcript proving the result.
          example: s3://pp-cert-eu/ten_01JB8Z00000000000000000000/rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA/auth-capture-refund.json
        paymentId:
          $ref: '#/components/schemas/PaymentId'
      example:
        id: AUTH_CAPTURE_REFUND_ROUNDTRIP
        description: Authorize then capture then refund round-trip succeeds in sandbox.
        passed: true
        evidenceRef: s3://pp-cert-eu/ten_01JB8Z00000000000000000000/rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA/auth-capture-refund.json
    CertificationMatrixCell:
      type: object
      title: Certification matrix cell
      description: One `(gateway, payment method, currency)` combination and its assertions.
      required: [gatewayCode, paymentMethod, currency, passed, assertions]
      additionalProperties: false
      properties:
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        passed:
          type: boolean
          description: True only when every assertion in this cell passed.
          example: true
        assertions:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/CertificationAssertion'
      example:
        gatewayCode: adyen
        paymentMethod: CARD
        currency: EUR
        passed: true
        assertions:
          - id: AUTH_CAPTURE_REFUND_ROUNDTRIP
            description: Authorize then capture then refund round-trip succeeds in sandbox.
            passed: true
    CertificationReport:
      type: object
      title: Certification report
      description: |
        A machine-checked matrix, not a checkbox. For every
        `(gateway, payment method, currency)` the merchant enabled, all seven assertions must
        pass. There is no partial pass. The report is signed, immutable once sealed, stored
        under Object Lock, and referenced from the merchant and the connection.
        `PRODUCTION_READY` is unreachable without a passing report for the production
        environment; a sandbox report never certifies a production connection.
      required: [id, merchantId, environment, suiteVersion, state, matrix, assertionsPassed, assertionsTotal, startedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 32
          description: Certification report identifier.
          example: rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        environment:
          $ref: '#/components/schemas/Environment'
        suiteVersion:
          type: string
          maxLength: 64
          description: Version of the certification suite that produced this report.
          example: cert-suite@2.4.0
        state:
          type: string
          enum: [RUNNING, PASSED, FAILED]
          description: Terminal both ways. A re-certification is a new report, never an edit.
          example: PASSED
        matrix:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CertificationMatrixCell'
        assertionsPassed:
          type: integer
          format: int32
          minimum: 0
          description: '`PASSED` requires `assertionsPassed == assertionsTotal`.'
          example: 14
        assertionsTotal:
          type: integer
          format: int32
          minimum: 1
          example: 14
        artifactUri:
          type: string
          format: uri
          description: Signed, immutable report in object storage under Object Lock.
          example: s3://pp-cert-eu/ten_01JB8Z00000000000000000000/rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA.json
        artifactSha256:
          $ref: '#/components/schemas/Sha256Hex'
        signature:
          type: string
          description: Detached signature over `artifactSha256`, verifiable without database access.
          example: MEUCIQDf2c9a1b7e4f0a6d3c8b5e2a1f7d4c0b9e6a3f8d5c2b1e0a7f4d3c6b9e2a1
        startedAt:
          type: string
          format: date-time
          example: '2026-08-27T18:12:00.000Z'
        completedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-08-27T18:44:31.004Z'
      example:
        id: rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA
        merchantId: mrc_01JB8Z11111111111111111111
        environment: PRODUCTION
        suiteVersion: cert-suite@2.4.0
        state: PASSED
        matrix:
          - gatewayCode: adyen
            paymentMethod: CARD
            currency: EUR
            passed: true
            assertions:
              - id: AUTH_CAPTURE_REFUND_ROUNDTRIP
                description: Authorize then capture then refund round-trip succeeds in sandbox.
                passed: true
        assertionsPassed: 14
        assertionsTotal: 14
        artifactUri: s3://pp-cert-eu/ten_01JB8Z00000000000000000000/rpt_01JB8ZAAAAAAAAAAAAAAAAAAAA.json
        artifactSha256: 9f2ce41b7a3d5c8e0b1f4a6d2c9e7b0a3f5d8c1e4b7a0d3f6c9e2b5a8d1f4c7e
        startedAt: '2026-08-27T18:12:00.000Z'
        completedAt: '2026-08-27T18:44:31.004Z'
    Environment:
      type: string
      title: Environment
      enum: [SANDBOX, PRODUCTION]
      example: PRODUCTION
    ConfigurationEnvironment:
      type: string
      title: Configuration environment
      description: |
        Lowercase form used inside the configuration document, matching the canonical schema.
      enum: [sandbox, production]
      example: production
    ConfigurationStatus:
      type: string
      title: Configuration status
      enum: [DRAFT, ACTIVE, SUPERSEDED, ROLLED_BACK]
      example: ACTIVE
    PaymentMethod:
      type: string
      title: Payment method
      description: |
        The platform's own vocabulary. A gateway's method string never appears here - mapping
        is the anti-corruption layer's job.
      enum:
        - CARD
        - APPLE_PAY
        - GOOGLE_PAY
        - PAYPAL
        - IDEAL
        - SEPA_DEBIT
        - ACH_DEBIT
        - BANCONTACT
        - SOFORT
        - KLARNA
      example: CARD
    RoutingStrategy:
      type: string
      title: Routing strategy
      enum: [PRIORITY_WITH_FALLBACK, WEIGHTED, LEAST_COST, LOWEST_LATENCY]
      example: PRIORITY_WITH_FALLBACK
    RoutingRuleCondition:
      type: object
      title: Routing rule condition
      description: |
        The `when` clause. All present fields must match for the rule to apply; an absent
        field matches anything. Rules are evaluated in declaration order and the first match
        wins - there is no scoring across rules, because a rule set whose outcome depends on
        evaluation order *and* on scores is not auditable.
      additionalProperties: false
      minProperties: 1
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        country:
          $ref: '#/components/schemas/CountryCode'
        amountAbove:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Applies when the payment amount is strictly greater than this.
      example:
        currency: EUR
        paymentMethod: CARD
    RoutingRuleOutcome:
      type: object
      title: Routing rule outcome
      description: The `then` clause - which gateway leads and which follow.
      required: [primary]
      additionalProperties: false
      properties:
        primary:
          $ref: '#/components/schemas/GatewayCode'
        fallback:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/GatewayCode'
          example: [stripe]
      example:
        primary: adyen
        fallback: [stripe]
    RoutingRule:
      type: object
      title: Routing rule
      required: [when, then]
      additionalProperties: false
      properties:
        when:
          $ref: '#/components/schemas/RoutingRuleCondition'
        then:
          $ref: '#/components/schemas/RoutingRuleOutcome'
      example:
        when: { currency: EUR, paymentMethod: CARD }
        then: { primary: adyen, fallback: [stripe] }
    RoutingWeights:
      type: object
      title: Routing weights
      description: |
        Relative influence of each signal when the strategy is `WEIGHTED`. The four weights
        must sum to 1.0; a set that does not sum to 1.0 is rejected by L4 rather than
        normalised, because silent normalisation hides a typo that changes traffic
        distribution.
      required: [health, successRate, cost, latency]
      additionalProperties: false
      properties:
        health:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.4
        successRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.3
        cost:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.2
        latency:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.1
      example:
        health: 0.4
        successRate: 0.3
        cost: 0.2
        latency: 0.1
    RoutingConfig:
      type: object
      title: Routing configuration
      description: |
        Which gateway a payment goes to, and in what order the alternatives are tried. A
        `DEPRECATED` gateway may not be named as `primary` in a newly published document.
        Every gateway named here must have a `CERTIFIED` connection for this merchant in this
        environment - L4 checks it at publish time and again at rollback time.
      required: [strategy, primary]
      additionalProperties: false
      properties:
        strategy:
          $ref: '#/components/schemas/RoutingStrategy'
        primary:
          $ref: '#/components/schemas/GatewayCode'
        fallback:
          type: array
          maxItems: 8
          description: Ordered failover candidates, tried left to right when the primary is unusable.
          items:
            $ref: '#/components/schemas/GatewayCode'
          example: [adyen]
        rules:
          type: array
          maxItems: 64
          description: Corridor-specific overrides, first match wins.
          items:
            $ref: '#/components/schemas/RoutingRule'
        weights:
          $ref: '#/components/schemas/RoutingWeights'
      example:
        strategy: PRIORITY_WITH_FALLBACK
        primary: stripe
        fallback: [adyen]
        rules:
          - when: { currency: EUR, paymentMethod: CARD }
            then: { primary: adyen, fallback: [stripe] }
        weights: { health: 0.4, successRate: 0.3, cost: 0.2, latency: 0.1 }
    VelocityLimits:
      type: object
      title: Velocity limits
      required: [maxPaymentsPerMinute, maxPerCardPerHour]
      additionalProperties: false
      properties:
        maxPaymentsPerMinute:
          type: integer
          format: int32
          minimum: 1
          description: Per-merchant payment creation ceiling.
          example: 300
        maxPerCardPerHour:
          type: integer
          format: int32
          minimum: 1
          description: |
            Per payment-method-reference ceiling. The single most effective card-testing
            control available without holding card data.
          example: 5
      example:
        maxPaymentsPerMinute: 300
        maxPerCardPerHour: 5
    RiskConfig:
      type: object
      title: Risk configuration
      description: |
        Policy limits evaluated at L5 and by the risk engine before dispatch. The risk engine
        fails open to the **policy default** declared here, never to "allow": an unreachable
        external scorer must not become an unlimited merchant.
      required: [maxTransactionAmount, dailyVolumeLimit, velocity]
      additionalProperties: false
      properties:
        maxTransactionAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Hard ceiling per payment. Exceeding it is `422 AMOUNT_EXCEEDS_LIMIT`.
        require3DSAbove:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Above this amount the risk decision is forced to `REQUIRE_3DS`. Strong customer
            authentication is a policy outcome, not a gateway default.
        dailyVolumeLimit:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Rolling 24-hour cumulative ceiling across all payments for this merchant.
        velocity:
          $ref: '#/components/schemas/VelocityLimits'
        blockedCountries:
          type: array
          maxItems: 256
          description: |
            Payer countries that are refused outright. Sanctions jurisdictions belong here and
            are additionally enforced platform-wide, so removing one from this list does not
            unblock it.
          items:
            $ref: '#/components/schemas/CountryCode'
          example: [KP, IR]
        fallbackDecision:
          type: string
          enum: [ALLOW, REQUIRE_3DS, DECLINE]
          default: REQUIRE_3DS
          description: |
            The policy default applied when the external scorer is unavailable. This is what
            "fail open to the policy default" means concretely.
          example: REQUIRE_3DS
      example:
        maxTransactionAmount: { amount: 1000000, currency: USD }
        require3DSAbove: { amount: 50000, currency: USD }
        dailyVolumeLimit: { amount: 50000000, currency: USD }
        velocity: { maxPaymentsPerMinute: 300, maxPerCardPerHour: 5 }
        blockedCountries: [KP, IR]
    LimitsConfig:
      type: object
      title: Operational limits
      required: [maxRefundWindowDays, maxPartialCaptures]
      additionalProperties: false
      properties:
        maxRefundWindowDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: |
            How long after capture a refund may be requested. Checked at L5. Must not exceed
            the gateway's own refund window, which L4 verifies against the capability
            descriptor.
          example: 180
        maxPartialCaptures:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Maximum number of partial captures against one authorization.
          example: 5
      example:
        maxRefundWindowDays: 180
        maxPartialCaptures: 5
    WebhookEndpoint:
      type: object
      title: Merchant webhook endpoint
      required: [url, events, secretRef]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            HTTPS only. Plaintext HTTP is rejected by L4 - a webhook carrying payment outcomes
            over cleartext is an information disclosure, and a redirect to HTTPS does not
            retroactively protect the first request.
          pattern: '^https://'
          example: https://hooks.acme.example/pp/events
        events:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            Event type patterns to deliver. `*` matches one segment, so `payment.*` matches
            `payment.authorized.v1` but not `merchant.activated.v1`.
          items:
            type: string
            maxLength: 128
          example: ['payment.*']
        secretRef:
          type: string
          maxLength: 512
          description: |
            Secrets-manager path of the HMAC signing secret. **The secret itself never appears
            in a configuration document, an event, a log line or an API response** - only this
            reference does.
          example: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/webhook-signing
        description:
          type: string
          maxLength: 256
          example: Primary order-service listener
        active:
          type: boolean
          default: true
          description: |
            Set `false` to stop delivery without losing the endpoint's configuration and
            secret binding.
          example: true
      example:
        url: https://hooks.acme.example/pp/events
        events: ['payment.*']
        secretRef: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/webhook-signing
        description: Primary order-service listener
        active: true
    WebhookRetryPolicy:
      type: object
      title: Webhook retry policy
      required: [maxAttempts, backoff]
      additionalProperties: false
      properties:
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
          description: |
            Total delivery attempts before the delivery is dead-lettered and an operator alert
            is raised.
          example: 8
        backoff:
          type: string
          enum: [EXPONENTIAL_JITTER, EXPONENTIAL, LINEAR]
          description: |
            `EXPONENTIAL_JITTER` is the default and the only one that avoids a retry storm
            when a merchant endpoint recovers and every parked delivery fires at once.
          example: EXPONENTIAL_JITTER
        initialDelaySeconds:
          type: integer
          format: int32
          minimum: 1
          default: 5
          example: 5
        maxDelaySeconds:
          type: integer
          format: int32
          minimum: 1
          default: 3600
          example: 3600
      example:
        maxAttempts: 8
        backoff: EXPONENTIAL_JITTER
        initialDelaySeconds: 5
        maxDelaySeconds: 3600
    WebhookConfig:
      type: object
      title: Webhook configuration
      description: Outbound webhook delivery for this merchant.
      required: [endpoints, retryPolicy]
      additionalProperties: false
      properties:
        endpoints:
          type: array
          minItems: 0
          maxItems: 16
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        retryPolicy:
          $ref: '#/components/schemas/WebhookRetryPolicy'
      example:
        endpoints:
          - url: https://hooks.acme.example/pp/events
            events: ['payment.*']
            secretRef: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/webhook-signing
            active: true
        retryPolicy: { maxAttempts: 8, backoff: EXPONENTIAL_JITTER }
    SettlementConfig:
      type: object
      title: Settlement configuration
      description: |
        How the gateway is expected to settle to the merchant. The platform **observes**
        settlement from gateway reports and reconciles against it; it does not compute or
        perform settlement, and it takes no custody of funds.
      required: [schedule, currency, holdDays]
      additionalProperties: false
      properties:
        schedule:
          type: string
          enum: [DAILY, WEEKLY, BIWEEKLY, MONTHLY, MANUAL]
          example: DAILY
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        holdDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 90
          description: Expected rolling reserve period, in days, as agreed with the gateway.
          example: 2
        weeklyAnchorDay:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          description: Payout day when `schedule` is `WEEKLY` or `BIWEEKLY`.
          example: FRIDAY
      example:
        schedule: DAILY
        currency: USD
        holdDays: 2
    FeatureFlags:
      type: object
      title: Feature flags
      description: |
        Per-merchant capability switches. A flag may only enable a capability the merchant's
        certified connections actually support; L4 checks each one against the capability
        descriptors.
      additionalProperties: false
      properties:
        networkTokens:
          type: boolean
          default: false
          description: Use network tokens instead of gateway tokens where the gateway supports them.
          example: true
        partialCapture:
          type: boolean
          default: false
          example: true
        multiCapture:
          type: boolean
          default: false
          example: false
        threeDsExemptions:
          type: boolean
          default: false
          description: |
            Allow TRA, low-value and MIT exemptions to be claimed. Every claimed exemption is
            modelled explicitly and audited.
          example: true
      example:
        networkTokens: true
        partialCapture: true
    MerchantConfiguration:
      type: object
      title: Merchant configuration document
      description: |
        The canonical desired-state document. Every write is validated (L4), assigned the next
        dense version, persisted with the full prior document retained, audited with actor and
        diff, and published as `configuration.published.v1` carrying the **complete** document
        - not a diff, because the configuration topic is compacted and a consumer restoring
        from it must get a usable state from one record.

        The data plane reads this through a cache with bounded staleness of 30 s and
        **fails static**, not open: if the control plane is entirely down it keeps processing
        with its last-known-good snapshot rather than either stopping or ignoring limits. Past
        `max_config_staleness` (15 min) it fails closed for new merchants while continuing to
        serve existing ones.
      required:
        - merchantId
        - version
        - status
        - environment
        - supportedCurrencies
        - paymentMethods
        - countries
        - routing
        - risk
        - limits
        - webhooks
        - settlement
      additionalProperties: false
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        version:
          type: integer
          format: int32
          minimum: 1
          description: Dense, monotonic per merchant. Assigned by the platform; ignored on write.
          example: 7
        status:
          $ref: '#/components/schemas/ConfigurationStatus'
        environment:
          $ref: '#/components/schemas/ConfigurationEnvironment'
        supportedCurrencies:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            Currencies this merchant may transact in. A payment in a currency absent here is
            `422 CURRENCY_NOT_SUPPORTED` before any gateway is contacted.
          items:
            $ref: '#/components/schemas/CurrencyCode'
          example: [USD, EUR]
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/PaymentMethod'
          example: [CARD, APPLE_PAY]
        countries:
          type: array
          minItems: 1
          maxItems: 256
          description: Payer countries this merchant may accept from.
          items:
            $ref: '#/components/schemas/CountryCode'
          example: [US, DE]
        routing:
          $ref: '#/components/schemas/RoutingConfig'
        risk:
          $ref: '#/components/schemas/RiskConfig'
        limits:
          $ref: '#/components/schemas/LimitsConfig'
        webhooks:
          $ref: '#/components/schemas/WebhookConfig'
        settlement:
          $ref: '#/components/schemas/SettlementConfig'
        featureFlags:
          $ref: '#/components/schemas/FeatureFlags'
      example:
        merchantId: mrc_01JB8Z11111111111111111111
        version: 7
        status: ACTIVE
        environment: production
        supportedCurrencies: [USD, EUR]
        paymentMethods: [CARD, APPLE_PAY]
        countries: [US, DE]
        routing:
          strategy: PRIORITY_WITH_FALLBACK
          primary: stripe
          fallback: [adyen]
          rules:
            - when: { currency: EUR, paymentMethod: CARD }
              then: { primary: adyen, fallback: [stripe] }
          weights: { health: 0.4, successRate: 0.3, cost: 0.2, latency: 0.1 }
        risk:
          maxTransactionAmount: { amount: 1000000, currency: USD }
          require3DSAbove: { amount: 50000, currency: USD }
          dailyVolumeLimit: { amount: 50000000, currency: USD }
          velocity: { maxPaymentsPerMinute: 300, maxPerCardPerHour: 5 }
          blockedCountries: [KP, IR]
        limits: { maxRefundWindowDays: 180, maxPartialCaptures: 5 }
        webhooks:
          endpoints:
            - url: https://hooks.acme.example/pp/events
              events: ['payment.*']
              secretRef: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/webhook-signing
          retryPolicy: { maxAttempts: 8, backoff: EXPONENTIAL_JITTER }
        settlement: { schedule: DAILY, currency: USD, holdDays: 2 }
        featureFlags: { networkTokens: true, partialCapture: true }
    ConfigurationVersion:
      type: object
      title: Configuration version
      description: |
        A configuration document plus its version metadata. History is strictly append-only: a
        rollback re-publishes an earlier document as a **new** version, never deletes or
        rewrites one.
      required: [configurationId, configurationVersionId, merchantId, version, document, digest, publishedBy, publishedAt]
      additionalProperties: false
      properties:
        configurationId:
          type: string
          pattern: '^cfg_[0-9A-Z]{26}$'
          description: Stable identifier of the merchant's configuration record across versions.
          example: cfg_01JB8ZBBBBBBBBBBBBBBBBBBBB
        configurationVersionId:
          $ref: '#/components/schemas/ConfigurationVersionId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        version:
          type: integer
          format: int32
          minimum: 1
          example: 7
        previousVersion:
          type: [integer, 'null']
          format: int32
          description: Absent (null) on version 1.
          example: 6
        rollbackOf:
          type: [integer, 'null']
          format: int32
          description: |
            Set when this version was produced by a rollback, naming the version whose
            document was restored. Its digest equals that version's digest, which is the
            machine-checkable proof that the rollback is faithful.
          example: null
        document:
          $ref: '#/components/schemas/MerchantConfiguration'
        digest:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: |
            `sha256(jcs(document))`. Two publishes of an identical document produce different
            versions but the same digest, which is how the propagation probe detects a genuine
            no-op.
        publishedBy:
          type: string
          maxLength: 128
          description: Actor identifier - an API client, a user, or `system:<component>`.
          example: cli_01JB8Z55555555555555555555
        publishedAt:
          type: string
          format: date-time
          example: '2026-08-27T18:59:12.006Z'
      example:
        configurationId: cfg_01JB8ZBBBBBBBBBBBBBBBBBBBB
        configurationVersionId: cfv_01JB8ZCCCCCCCCCCCCCCCCCCCC
        merchantId: mrc_01JB8Z11111111111111111111
        version: 7
        previousVersion: 6
        rollbackOf: null
        digest: 7c1a9de0f3b6a2c85e41d079b3c6a51f8e2d4b70c9a63f18e5d20b74a9c1f6e3
        publishedBy: cli_01JB8Z55555555555555555555
        publishedAt: '2026-08-27T18:59:12.006Z'
        document:
          merchantId: mrc_01JB8Z11111111111111111111
          version: 7
          status: ACTIVE
          environment: production
          supportedCurrencies: [USD, EUR]
          paymentMethods: [CARD, APPLE_PAY]
          countries: [US, DE]
          routing:
            strategy: PRIORITY_WITH_FALLBACK
            primary: stripe
            fallback: [adyen]
            weights: { health: 0.4, successRate: 0.3, cost: 0.2, latency: 0.1 }
          risk:
            maxTransactionAmount: { amount: 1000000, currency: USD }
            dailyVolumeLimit: { amount: 50000000, currency: USD }
            velocity: { maxPaymentsPerMinute: 300, maxPerCardPerHour: 5 }
          limits: { maxRefundWindowDays: 180, maxPartialCaptures: 5 }
          webhooks:
            endpoints: []
            retryPolicy: { maxAttempts: 8, backoff: EXPONENTIAL_JITTER }
          settlement: { schedule: DAILY, currency: USD, holdDays: 2 }
    ConfigurationRollbackRequest:
      type: object
      title: Configuration rollback request
      required: [toVersion, reason]
      additionalProperties: false
      properties:
        toVersion:
          type: integer
          format: int32
          minimum: 1
          description: The version whose document should be restored as a new version.
          example: 6
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Why the rollback is being performed. Required, recorded in the audit trail and
            carried in `configuration.rolled_back.v1`. An unexplained production rollback is
            an incident nobody can reconstruct later.
          example: 'Routing weights caused authorization-rate regression, INC-4471'
      example:
        toVersion: 6
        reason: 'Routing weights caused authorization-rate regression, INC-4471'
    GatewayCode:
      type: string
      title: Gateway code
      description: |
        The gateway's stable, immutable, globally unique code. Used in configuration
        documents, metric labels and webhook paths, where an opaque ULID would be unusable.
      pattern: '^[a-z][a-z0-9_]{1,31}$'
      example: stripe
    GatewayStatus:
      type: string
      title: Gateway catalogue status
      description: |
        `ACTIVE -> DEPRECATED -> DISABLED`. `DISABLED` is terminal for routing but not for
        reconciliation: payments already in flight still resolve.
      enum: [ACTIVE, DEPRECATED, DISABLED]
      example: ACTIVE
    GatewayOperation:
      type: string
      title: Gateway operation
      description: Health and circuit state are tracked per `(gateway, operation)`.
      enum: [AUTHORIZE, CAPTURE, REFUND, VOID, LOOKUP, PROVISION]
      example: AUTHORIZE
    HealthState:
      type: string
      title: Gateway health state
      description: |
        `HEALTHY -> DEGRADED` above 5 % errors over 30 s with at least 20 samples;
        `DEGRADED -> UNHEALTHY` above 25 % errors or p99 over 5 s, opening the circuit;
        `UNHEALTHY -> PROBING` after cool-down; `PROBING -> HEALTHY` after 3 consecutive
        successes, or back to `UNHEALTHY` on any failure with the cool-down doubled, capped at
        5 minutes. `DEGRADED` never transitions straight to `PROBING`.
      enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBING]
      example: HEALTHY
    CircuitState:
      type: string
      title: Circuit breaker state
      enum: [CLOSED, OPEN, HALF_OPEN]
      example: CLOSED
    WebhookSignatureScheme:
      type: string
      title: Webhook signature scheme
      enum: [HMAC_SHA256, ED25519, JWS]
      example: HMAC_SHA256
    GatewayCapabilities:
      type: object
      title: Gateway capability descriptor
      description: |
        A declarative statement of what a gateway supports. It is the input to routing
        eligibility, to L4 configuration validation and to the certification matrix. An
        invalid descriptor cannot be persisted.

        Routing treats an absent capability as a hard exclusion, never as "probably fine":
        discovering at authorization time that a gateway does not support a currency costs a
        declined payment and a merchant call.
      required: [countries, currencies, paymentMethods, operations, supports3DS, supportsPartialCapture, refundWindowDays, webhookSignatureScheme]
      additionalProperties: false
      properties:
        countries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CountryCode'
          example: [DE, NL, US]
        currencies:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CurrencyCode'
          example: [EUR, USD]
        paymentMethods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentMethod'
          example: [CARD, IDEAL]
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GatewayOperation'
          example: [AUTHORIZE, CAPTURE, REFUND, VOID, LOOKUP, PROVISION]
        supports3DS:
          type: boolean
          example: true
        supportsPartialCapture:
          type: boolean
          example: true
        supportsMultiCapture:
          type: boolean
          example: true
        supportsNetworkTokens:
          type: boolean
          example: true
        refundWindowDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 3650
          description: |
            How long after capture the gateway accepts a refund. A merchant's configured
            refund window may not exceed this.
          example: 180
        webhookSignatureScheme:
          $ref: '#/components/schemas/WebhookSignatureScheme'
        maxAmountByCurrency:
          type: object
          description: |
            Per-currency ceilings imposed by the gateway, in minor units. Absent means no
            gateway-imposed ceiling beyond the merchant's own risk policy.
          additionalProperties:
            type: integer
            format: int64
            minimum: 1
          propertyNames:
            pattern: '^[A-Z]{3}$'
          example:
            EUR: 99999999
            USD: 99999999
      example:
        countries: [DE, NL, US]
        currencies: [EUR, USD]
        paymentMethods: [CARD, IDEAL]
        operations: [AUTHORIZE, CAPTURE, REFUND, VOID, LOOKUP, PROVISION]
        supports3DS: true
        supportsPartialCapture: true
        supportsMultiCapture: true
        supportsNetworkTokens: true
        refundWindowDays: 180
        webhookSignatureScheme: HMAC_SHA256
        maxAmountByCurrency: { EUR: 99999999, USD: 99999999 }
    Gateway:
      type: object
      title: Gateway
      description: |
        A third-party payment processor, described by a capability descriptor and reached
        through an adapter. Platform-global and read-only to tenants: this is the one resource
        that carries no tenant identifier.
      required: [id, code, displayName, status, adapterVersion, capabilities, regions]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/GatewayId'
        code:
          $ref: '#/components/schemas/GatewayCode'
        displayName:
          type: string
          maxLength: 128
          example: Stripe
        status:
          $ref: '#/components/schemas/GatewayStatus'
        adapterVersion:
          type: string
          maxLength: 32
          description: Version of the anti-corruption adapter currently deployed for this gateway.
          example: 3.2.1
        capabilities:
          $ref: '#/components/schemas/GatewayCapabilities'
        regions:
          type: array
          minItems: 1
          description: |
            Regions in which this gateway may be selected. The routing engine will not select
            a gateway whose region violates the tenant's residency policy.
          items:
            type: string
            maxLength: 32
          example: [eu-central-1, us-east-1]
        deprecatedAt:
          type: [string, 'null']
          format: date-time
          example: null
      example:
        id: stripe
        code: stripe
        displayName: Stripe
        status: ACTIVE
        adapterVersion: 3.2.1
        regions: [eu-central-1, us-east-1]
        deprecatedAt: null
        capabilities:
          countries: [DE, NL, US]
          currencies: [EUR, USD]
          paymentMethods: [CARD, APPLE_PAY]
          operations: [AUTHORIZE, CAPTURE, REFUND, VOID, LOOKUP, PROVISION]
          supports3DS: true
          supportsPartialCapture: true
          refundWindowDays: 180
          webhookSignatureScheme: HMAC_SHA256
    GatewayHealth:
      type: object
      title: Gateway health
      description: |
        Health for one `(gateway, operation)` pair in one region. Deliberately not per
        merchant: per-merchant samples are too sparse to be statistically meaningful.

        `sampleCount` is carried so a consumer can judge confidence - below 20 samples the
        transition to `DEGRADED` is not taken at all.
      required: [gatewayId, gatewayCode, operation, state, circuitState, errorRate, p99LatencyMs, sampleCount, windowSeconds, region, stateChangedAt]
      additionalProperties: false
      properties:
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
        operation:
          $ref: '#/components/schemas/GatewayOperation'
        state:
          $ref: '#/components/schemas/HealthState'
        previousState:
          $ref: '#/components/schemas/HealthState'
        circuitState:
          $ref: '#/components/schemas/CircuitState'
        errorRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Error rate over the evaluation window, as a fraction.
          example: 0.071
        p99LatencyMs:
          type: integer
          format: int32
          minimum: 0
          example: 1840
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          example: 412
        windowSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Length of the sliding evaluation window. 30 by default.
          example: 30
        cooldownSeconds:
          type: [integer, 'null']
          format: int32
          description: |
            Remaining cool-down while `UNHEALTHY`. Doubles per failed probe, capped at 300.
          example: null
        consecutiveProbeSuccesses:
          type: integer
          format: int32
          minimum: 0
          description: Successful probes so far while `PROBING`. Three promote to `HEALTHY`.
          example: 0
        region:
          type: string
          maxLength: 32
          description: |
            Region these measurements were taken in. A consumer in another region must not act
            on them.
          example: eu-central-1
        observedAtAgeMs:
          type: integer
          format: int64
          minimum: 0
          description: |
            How stale this snapshot is. Health reads are `AP` - a stale answer with a stated
            age beats no answer.
          example: 1200
        stateChangedAt:
          type: string
          format: date-time
          example: '2026-08-26T14:05:00.000Z'
      example:
        gatewayId: stripe
        gatewayCode: stripe
        operation: AUTHORIZE
        state: DEGRADED
        previousState: HEALTHY
        circuitState: CLOSED
        errorRate: 0.071
        p99LatencyMs: 1840
        sampleCount: 412
        windowSeconds: 30
        cooldownSeconds: null
        consecutiveProbeSuccesses: 0
        region: eu-central-1
        observedAtAgeMs: 1200
        stateChangedAt: '2026-08-26T14:05:00.000Z'
    GatewayHealthReport:
      type: object
      title: Gateway health report
      required: [gatewayId, gatewayCode, region, operations]
      additionalProperties: false
      properties:
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
        region:
          type: string
          maxLength: 32
          example: eu-central-1
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GatewayHealth'
      example:
        gatewayId: stripe
        gatewayCode: stripe
        region: eu-central-1
        operations:
          - gatewayId: stripe
            gatewayCode: stripe
            operation: AUTHORIZE
            state: HEALTHY
            circuitState: CLOSED
            errorRate: 0.004
            p99LatencyMs: 380
            sampleCount: 5120
            windowSeconds: 30
            region: eu-central-1
            observedAtAgeMs: 800
            stateChangedAt: '2026-08-26T13:40:00.000Z'
    RotateCredentialsRequest:
      type: object
      title: Credential rotation request
      required: [merchantId, environment, reason]
      additionalProperties: false
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        environment:
          $ref: '#/components/schemas/Environment'
        reason:
          type: string
          enum: [SCHEDULED, SUSPECTED_COMPROMISE, OPERATOR_REQUEST, GATEWAY_REQUEST]
          description: |
            `SUSPECTED_COMPROMISE` skips the dual-run overlap and revokes the old credential
            immediately, accepting in-flight failures - a compromised credential outranks a
            handful of retryable errors.
          example: SCHEDULED
        note:
          type: string
          maxLength: 512
          example: 90-day rotation window closes 2026-09-01.
      example:
        merchantId: mrc_01JB8Z11111111111111111111
        environment: PRODUCTION
        reason: SCHEDULED
        note: 90-day rotation window closes 2026-09-01.
    CredentialRotationAccepted:
      type: object
      title: Credential rotation acceptance
      description: |
        Rotation metadata only. Credential material never crosses this boundary in either
        direction.
      required: [connectionId, gatewayId, merchantId, environment, state, startedAt]
      additionalProperties: false
      properties:
        connectionId:
          $ref: '#/components/schemas/ConnectionId'
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        environment:
          $ref: '#/components/schemas/Environment'
        state:
          type: string
          enum: [SCHEDULED, RUNNING, DUAL_RUN, COMPLETED, FAILED]
          example: RUNNING
        credentialRef:
          type: string
          maxLength: 512
          description: Secrets-manager path of the new credential. A reference, never material.
          example: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/stripe
        previousExpiresAt:
          type: string
          format: date-time
          description: When the outgoing credential is revoked, closing the dual-run overlap.
          example: '2026-08-27T20:00:00.000Z'
        startedAt:
          type: string
          format: date-time
          example: '2026-08-27T19:30:00.000Z'
      example:
        connectionId: gwc_01JB8Z88888888888888888888
        gatewayId: stripe
        merchantId: mrc_01JB8Z11111111111111111111
        environment: PRODUCTION
        state: RUNNING
        credentialRef: /production/ten_01JB8Z00000000000000000000/mrc_01JB8Z11111111111111111111/stripe
        previousExpiresAt: '2026-08-27T20:00:00.000Z'
        startedAt: '2026-08-27T19:30:00.000Z'
    PaymentState:
      type: string
      title: Payment state
      description: |
        The 14 states of the payment FSM. `PENDING` and `PROCESSING` exist so that
        asynchronous and *unknown* outcomes are representable: without them a gateway timeout
        forces the platform to lie about whether money moved.
      enum:
        - CREATED
        - REQUIRES_ACTION
        - PROCESSING
        - PENDING
        - AUTHORIZED
        - CAPTURED
        - SETTLED
        - PARTIALLY_REFUNDED
        - REFUNDED
        - DISPUTED
        - VOIDED
        - FAILED
        - CANCELED
        - EXPIRED
      example: AUTHORIZED
    AttemptState:
      type: string
      title: Payment attempt state
      enum: [PENDING, DISPATCHED, COMPLETED]
      example: COMPLETED
    AttemptOutcome:
      type: string
      title: Payment attempt outcome
      description: |
        `DECLINED` - the gateway definitively said no. Failover is permitted only when the
        decline reason is in the retryable-decline set; a hard decline (stolen card, invalid
        account) must **never** be retried on another gateway, because that is card-testing
        behaviour and gets a platform de-registered.

        `ERROR` - our side or transport failed before the gateway could have acted. Safe to
        retry.

        `TIMEOUT_UNKNOWN` - we do not know whether money moved. **Never retried
        automatically.** Enters the reconciliation queue and is resolved by a gateway status
        lookup, a webhook or a settlement report.
      enum: [SUCCESS, DECLINED, ERROR, TIMEOUT_UNKNOWN]
      example: SUCCESS
    CaptureMode:
      type: string
      title: Capture mode
      enum: [AUTOMATIC, MANUAL]
      example: MANUAL
    RiskDecision:
      type: string
      title: Risk decision
      enum: [ALLOW, REQUIRE_3DS, DECLINE]
      example: ALLOW
    ThreeDsStatus:
      type: string
      title: 3-D Secure status
      description: |
        Exemptions are modelled explicitly and audited: claiming one is a decision the
        platform must be able to defend to a regulator, so it is never implicit.
      enum:
        - AUTHENTICATED
        - ATTEMPTED
        - CHALLENGE_REQUIRED
        - FAILED
        - EXEMPT_TRA
        - EXEMPT_LOW_VALUE
        - EXEMPT_MIT
        - NOT_APPLICABLE
      example: EXEMPT_LOW_VALUE
    RefundReason:
      type: string
      title: Refund reason
      enum: [DUPLICATE, FRAUDULENT, REQUESTED_BY_CUSTOMER, OTHER]
      example: REQUESTED_BY_CUSTOMER
    VoidReason:
      type: string
      title: Void reason
      enum: [MERCHANT_REQUEST, AUTH_EXPIRY_PREVENTION, RISK_REVERSAL, ONBOARDING_TEST]
      example: MERCHANT_REQUEST
    RefundState:
      type: string
      title: Refund state
      enum: [REQUESTED, PROCESSING, SUCCEEDED, FAILED]
      example: SUCCEEDED
    RoutingReason:
      type: string
      title: Routing reason
      description: |
        Why a gateway was chosen, or why it was excluded. The routing plan records a reason
        for **every** candidate including the rejected ones, because "why was this gateway not
        chosen" is the question asked in every routing incident.
      enum:
        - PRIMARY_BY_POLICY
        - COST_PREFERRED
        - LOWEST_LATENCY
        - WEIGHTED_SCORE
        - FALLBACK_BY_POLICY
        - HEALTH_DEGRADED
        - CIRCUIT_OPEN
        - CURRENCY_UNSUPPORTED
        - METHOD_UNSUPPORTED
        - CAPABILITY_MISSING
        - RESIDENCY_VIOLATION
        - NOT_CERTIFIED
        - AMOUNT_ABOVE_GATEWAY_MAX
      example: PRIMARY_BY_POLICY
    PaymentMethodReference:
      title: Payment method reference
      description: |
        **A reference to a payment instrument, never the instrument itself.**

        This platform is assessed at SAQ-A / A-EP level because cardholder data neither
        traverses nor is stored by it. That property has to be structural, not a promise, so
        this schema is built to make submitting a primary account number *impossible to
        express*:

        1. It is a closed `oneOf` over three variants, each with `additionalProperties:
           false`. There is no field named `pan`, `cardNumber`, `cvv`, `cvc`, `track1`,
           `track2` or `expiry` anywhere in this API - not optional, not deprecated, absent.
        2. Every token field must **start with a letter**
           (`^[A-Za-z][A-Za-z0-9_.:-]{7,254}$`). A PAN is 13-19 digits, so a PAN can never
           satisfy the pattern. This is why a bare network token (a DPAN, which is itself
           PAN-formatted) is *not* accepted inline: it is referenced by vault reference
           instead, which keeps the digits out of our request bodies entirely.
        3. Independently of this schema, the L1 validator runs a Luhn-checked PAN detector
           over **every** string field in **every** request. A hit is
           `400 SENSITIVE_DATA_IN_REQUEST`; the value is not logged and a security event is
           raised. Schema and detector are belt and braces: a schema can be bypassed by a
           future field, a detector cannot.

        If a tenant genuinely requires vaulting, that capability lives in a physically and
        administratively separate card-vault system with its own SAQ-D assessment, reached
        through a port. It is not part of this API.
      oneOf:
        - $ref: '#/components/schemas/GatewayTokenReference'
        - $ref: '#/components/schemas/NetworkTokenVaultReference'
        - $ref: '#/components/schemas/StoredInstrumentReference'
      discriminator:
        propertyName: type
        mapping:
          GATEWAY_TOKEN: '#/components/schemas/GatewayTokenReference'
          NETWORK_TOKEN_REF: '#/components/schemas/NetworkTokenVaultReference'
          STORED_INSTRUMENT: '#/components/schemas/StoredInstrumentReference'
      example:
        type: GATEWAY_TOKEN
        gatewayCode: stripe
        token: pm_1OqZ4L2eZvKYlo2CqXbTgHkF
        brand: VISA
        last4: '4242'
        expiryMonth: 11
        expiryYear: 2029
    PaymentTokenString:
      type: string
      title: Token string
      description: |
        Opaque token. Must begin with a letter, which is what makes a 13-19 digit PAN
        structurally unrepresentable here.
      minLength: 8
      maxLength: 255
      pattern: '^[A-Za-z][A-Za-z0-9_.:-]{7,254}$'
      example: pm_1OqZ4L2eZvKYlo2CqXbTgHkF
    GatewayTokenReference:
      type: object
      title: Gateway token reference
      description: |
        A token minted by the gateway's own hosted fields or SDK. The customer's card data
        went from their browser to the gateway and never touched us.
      required: [type, gatewayCode, token]
      additionalProperties: false
      properties:
        type:
          type: string
          const: GATEWAY_TOKEN
          example: GATEWAY_TOKEN
        gatewayCode:
          allOf:
            - $ref: '#/components/schemas/GatewayCode'
          description: |
            The gateway that minted the token. A gateway token is only meaningful to its
            issuer, so this constrains routing: failover to a different gateway requires a
            token that gateway can accept.
        token:
          $ref: '#/components/schemas/PaymentTokenString'
        brand:
          type: string
          enum: [VISA, MASTERCARD, AMEX, DISCOVER, JCB, DINERS, UNIONPAY, UNKNOWN]
          description: Card brand, as reported by the tokenizing gateway. Display and routing only.
          example: VISA
        last4:
          type: string
          pattern: '^[0-9]{4}$'
          description: |
            Last four digits, for display and support. Four digits are not cardholder data
            under PCI DSS and cannot be extended into a PAN.
          example: '4242'
        expiryMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: |
            Expiry month of the underlying instrument, for account-updater and MIT
            scheduling. Not sufficient to transact with.
          example: 11
        expiryYear:
          type: integer
          format: int32
          minimum: 2020
          maximum: 2099
          example: 2029
      example:
        type: GATEWAY_TOKEN
        gatewayCode: stripe
        token: pm_1OqZ4L2eZvKYlo2CqXbTgHkF
        brand: VISA
        last4: '4242'
        expiryMonth: 11
        expiryYear: 2029
    NetworkTokenVaultReference:
      type: object
      title: Network token vault reference
      description: |
        A reference to a network token (DPAN) held in a segregated vault, **not the network
        token itself**. A DPAN is PAN-formatted, so accepting one inline would put digits that
        look exactly like cardholder data into our request bodies, logs and traces - the thing
        this design exists to prevent. The vault resolves the reference at dispatch time
        inside its own compliance boundary.
      required: [type, vaultReference]
      additionalProperties: false
      properties:
        type:
          type: string
          const: NETWORK_TOKEN_REF
          example: NETWORK_TOKEN_REF
        vaultReference:
          allOf:
            - $ref: '#/components/schemas/PaymentTokenString'
          description: Opaque handle issued by the card vault. Resolvable only by the vault.
        tokenRequestorId:
          type: string
          pattern: '^[0-9A-Za-z]{1,32}$'
          description: Scheme-assigned token requestor identifier.
          example: 40010030273
        brand:
          type: string
          enum: [VISA, MASTERCARD, AMEX, DISCOVER, JCB, DINERS, UNIONPAY, UNKNOWN]
          example: VISA
        last4:
          type: string
          pattern: '^[0-9]{4}$'
          example: '4242'
      example:
        type: NETWORK_TOKEN_REF
        vaultReference: vlt_9fA2c7Kd3Le8Mn1Qp5Rt
        tokenRequestorId: '40010030273'
        brand: VISA
        last4: '4242'
    StoredInstrumentReference:
      type: object
      title: Stored instrument reference
      description: |
        A previously used instrument, referenced by the platform identifier returned on the
        payment that first used it. Used for merchant-initiated transactions and repeat
        purchases; `networkTransactionId` chains the MIT to its original cardholder-initiated
        authorization, which the schemes require.
      required: [type, instrumentId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: STORED_INSTRUMENT
          example: STORED_INSTRUMENT
        instrumentId:
          type: string
          pattern: '^pmi_[0-9A-Z]{26}$'
          description: Platform identifier of the stored instrument.
          example: pmi_01JB8ZVVVVVVVVVVVVVVVVVVVV
        networkTransactionId:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'
          description: |
            Scheme transaction reference of the initial cardholder-initiated payment, chaining
            this merchant-initiated transaction to it.
          example: MCC0826114031
        usage:
          type: string
          enum: [CUSTOMER_INITIATED, MERCHANT_INITIATED_RECURRING, MERCHANT_INITIATED_UNSCHEDULED]
          description: |
            Drives SCA exemption eligibility. A merchant-initiated transaction claiming
            `EXEMPT_MIT` without a chained `networkTransactionId` is rejected at L5.
          example: MERCHANT_INITIATED_RECURRING
      example:
        type: STORED_INSTRUMENT
        instrumentId: pmi_01JB8ZVVVVVVVVVVVVVVVVVVVV
        networkTransactionId: MCC0826114031
        usage: MERCHANT_INITIATED_RECURRING
    PaymentAttempt:
      type: object
      title: Payment attempt
      description: |
        One execution of a payment intent against one gateway. A payment has one or more
        attempts; failover creates a **new** attempt and never mutates the old one.

        At most one attempt per payment may be in a successful terminal outcome, enforced by a
        partial unique index in the database. That constraint is what makes double-charging
        structurally impossible rather than merely unlikely.
      required: [id, attemptNumber, gatewayId, gatewayCode, connectionId, operation, state, requestSentAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/AttemptId'
        attemptNumber:
          type: integer
          format: int32
          minimum: 1
          description: Dense from 1, unique per payment.
          example: 1
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
        connectionId:
          $ref: '#/components/schemas/ConnectionId'
        operation:
          type: string
          enum: [AUTHORIZE, CAPTURE, REFUND, VOID]
          example: AUTHORIZE
        state:
          $ref: '#/components/schemas/AttemptState'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/AttemptOutcome'
            - type: 'null'
          description: Null while the attempt is not `COMPLETED`.
        gatewayReference:
          type: [string, 'null']
          maxLength: 128
          description: |
            The gateway's transaction identifier, needed for capture, void and reconciliation.
          example: pi_3OqZ4L2eZvKYlo2C
        declineReasonCode:
          type: [string, 'null']
          maxLength: 64
          description: |
            Normalized decline reason. **Never the gateway's raw string** - a foreign
            vocabulary reaching this field is an anti-corruption-layer failure.
          example: INSUFFICIENT_FUNDS
        declineIsRetryable:
          type: [boolean, 'null']
          description: |
            Whether another gateway could plausibly succeed. Required when the outcome is
            `DECLINED`, and the routing feedback loop keys on it. `false` means hard decline:
            no failover, ever.
          example: false
        normalizedErrorCode:
          type: [string, 'null']
          maxLength: 64
          description: Platform error code from the catalogue, when the attempt errored.
          example: GATEWAY_TIMEOUT
        routingReasons:
          type: array
          description: Why this gateway was selected for this attempt.
          items:
            $ref: '#/components/schemas/RoutingReason'
          example: [PRIMARY_BY_POLICY]
        latencyMs:
          type: [integer, 'null']
          format: int32
          minimum: 0
          example: 412
        configSnapshotAgeMs:
          type: integer
          format: int64
          minimum: 0
          description: |
            How stale the merchant configuration was when this routing decision was made. The
            field that makes a staleness incident diagnosable after the fact.
          example: 4180
        requestSentAt:
          type: string
          format: date-time
          example: '2026-08-26T14:03:11.001Z'
        responseReceivedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-08-26T14:03:11.413Z'
      example:
        id: att_01JB8Z44444444444444444444
        attemptNumber: 1
        gatewayId: stripe
        gatewayCode: stripe
        connectionId: gwc_01JB8Z88888888888888888888
        operation: AUTHORIZE
        state: COMPLETED
        outcome: SUCCESS
        gatewayReference: pi_3OqZ4L2eZvKYlo2C
        declineReasonCode: null
        declineIsRetryable: null
        normalizedErrorCode: null
        routingReasons: [PRIMARY_BY_POLICY]
        latencyMs: 412
        configSnapshotAgeMs: 4180
        requestSentAt: '2026-08-26T14:03:11.001Z'
        responseReceivedAt: '2026-08-26T14:03:11.413Z'
    RoutingCandidate:
      type: object
      title: Routing candidate
      required: [gatewayCode, rank, eligible, reasons]
      additionalProperties: false
      properties:
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        gatewayCode:
          $ref: '#/components/schemas/GatewayCode'
        rank:
          type: integer
          format: int32
          minimum: 0
          description: |
            Dense from 1 among eligible candidates. `0` marks an excluded candidate, which is
            recorded precisely so the plan explains why a gateway was *not* chosen.
          example: 1
        score:
          type: number
          format: double
          description: Weighted score, when the strategy is `WEIGHTED`.
          example: 0.87
        eligible:
          type: boolean
          example: true
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutingReason'
          example: [PRIMARY_BY_POLICY]
      example:
        gatewayId: stripe
        gatewayCode: stripe
        rank: 1
        score: 0.87
        eligible: true
        reasons: [PRIMARY_BY_POLICY]
    RoutingPlan:
      type: object
      title: Routing plan
      description: |
        An ordered, reason-annotated list of candidate gateways produced for one payment at
        one instant, persisted with the payment for auditability.

        **Immutable after creation.** A plan is the record of a decision; amending it destroys
        the audit trail. An empty candidate list is a legal plan and produces
        `503 NO_ELIGIBLE_GATEWAY`.
      required: [id, merchantId, strategy, candidates, configVersion, configSnapshotAgeMs, decidedAt, decidedBy]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/RoutingPlanId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        strategy:
          $ref: '#/components/schemas/RoutingStrategy'
        candidates:
          type: array
          description: Every candidate considered, eligible and excluded alike.
          items:
            $ref: '#/components/schemas/RoutingCandidate'
        policyVersion:
          type: integer
          format: int32
          description: Version of the routing policy that produced this plan.
          example: 3
        configVersion:
          type: integer
          format: int32
          minimum: 1
          description: Merchant configuration version the decision was made against.
          example: 7
        configSnapshotAgeMs:
          type: integer
          format: int64
          minimum: 0
          example: 4180
        decidedAt:
          type: string
          format: date-time
          example: '2026-08-26T14:03:10.995Z'
        decidedBy:
          type: string
          maxLength: 64
          description: The routing engine build that produced the plan.
          example: routing-engine@2.7.0
      example:
        id: rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE
        merchantId: mrc_01JB8Z11111111111111111111
        paymentId: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        strategy: PRIORITY_WITH_FALLBACK
        policyVersion: 3
        configVersion: 7
        configSnapshotAgeMs: 4180
        decidedAt: '2026-08-26T14:03:10.995Z'
        decidedBy: routing-engine@2.7.0
        candidates:
          - gatewayId: stripe
            gatewayCode: stripe
            rank: 1
            score: 0.87
            eligible: true
            reasons: [PRIMARY_BY_POLICY]
          - gatewayCode: adyen
            rank: 0
            eligible: false
            reasons: [CIRCUIT_OPEN]
    Refund:
      type: object
      title: Refund
      description: |
        Money returned to the payer against a captured payment. A `FAILED` refund does not
        decrement the refunded total: the amount is reserved on `REQUESTED` and released on
        `FAILED`, which is why the refunded total and the sum of succeeded refunds are
        reconciled nightly rather than assumed equal.
      required: [id, paymentId, amount, state, reason, requestedBy, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/RefundId'
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            This refund only. Its currency must equal the payment's currency - a mismatch is
            an error, never a conversion.
        state:
          $ref: '#/components/schemas/RefundState'
        reason:
          $ref: '#/components/schemas/RefundReason'
        reasonDetail:
          type: string
          maxLength: 512
          example: Customer returned item, RMA 88213.
        gatewayId:
          $ref: '#/components/schemas/GatewayId'
        gatewayReference:
          type: [string, 'null']
          maxLength: 128
          example: re_3OqZ4L2eZvKYlo2C
        refundedTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Cumulative refunded across the payment after this refund. Invariant I1 evidence.
        capturedTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Cumulative captured. Invariant I1: `refundedTotal <= capturedTotal`.'
        isFullRefund:
          type: boolean
          description: |
            Whether the payment is now fully refunded. Carried so a consumer never has to
            recompute the difference between `PARTIALLY_REFUNDED` and `REFUNDED`.
          example: false
        requestedBy:
          type: string
          maxLength: 128
          example: cli_01JB8Z55555555555555555555
        failureCode:
          type: [string, 'null']
          maxLength: 64
          description: Populated when `state` is `FAILED`.
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-08-28T09:31:02.884Z'
        completedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-08-28T09:31:03.512Z'
      example:
        id: ref_01JB8ZGGGGGGGGGGGGGGGGGGGG
        paymentId: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        amount: { amount: 300, currency: USD }
        state: SUCCEEDED
        reason: REQUESTED_BY_CUSTOMER
        reasonDetail: Customer returned item, RMA 88213.
        gatewayId: stripe
        gatewayReference: re_3OqZ4L2eZvKYlo2C
        refundedTotal: { amount: 300, currency: USD }
        capturedTotal: { amount: 600, currency: USD }
        isFullRefund: false
        requestedBy: cli_01JB8Z55555555555555555555
        failureCode: null
        createdAt: '2026-08-28T09:31:02.884Z'
        completedAt: '2026-08-28T09:31:03.512Z'
    NextAction:
      type: object
      title: Next action
      description: |
        What the payer must do for a payment in `REQUIRES_ACTION` - typically a 3DS challenge
        or a bank redirect.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [REDIRECT, THREE_DS_CHALLENGE, DISPLAY_VOUCHER, AWAIT_BANK_DEBIT]
          example: REDIRECT
        redirectUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where to send the payer. Single-use and short-lived.
          example: https://3ds.adyen.example/challenge/6f2a1c
        expiresAt:
          type: string
          format: date-time
          description: |
            After this instant the payment moves to `EXPIRED` rather than remaining stuck.
          example: '2026-08-26T14:18:11.000Z'
      example:
        type: REDIRECT
        redirectUrl: https://3ds.adyen.example/challenge/6f2a1c
        expiresAt: '2026-08-26T14:18:11.000Z'
    Payment:
      type: object
      title: Payment
      description: |
        The merchant's intent to move money. Amount, currency, merchant and tenant are
        **immutable after creation** (invariant I4), enforced in the aggregate and by a
        database trigger.

        `capturedAmount <= authorizedAmount` (I2) and `refundedAmount <= capturedAmount` (I1)
        hold at all times, in the domain and as database constraints.
      required: [id, merchantId, state, amount, capturedAmount, refundedAmount, paymentMethod, captureMode, reconciliationRequired, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        state:
          $ref: '#/components/schemas/PaymentState'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The requested amount. Immutable.
        authorizedAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            The amount actually held, which may be less than `amount` for a partial
            authorization.
        capturedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Cumulative captured across all captures.
        refundedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Cumulative refunded, including reserved amounts on in-flight refunds.
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        captureMode:
          $ref: '#/components/schemas/CaptureMode'
        riskDecision:
          $ref: '#/components/schemas/RiskDecision'
        riskScore:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 100
          description: |
            Null when the external scorer was unavailable and the policy default applied -
            distinguishable from a genuine score of 0.
          example: 12
        threeDsStatus:
          oneOf:
            - $ref: '#/components/schemas/ThreeDsStatus'
            - type: 'null'
        nextAction:
          oneOf:
            - $ref: '#/components/schemas/NextAction'
            - type: 'null'
          description: Present only while the payment is in `REQUIRES_ACTION`.
        routingPlanId:
          type: [string, 'null']
          description: Null when routing produced no candidates.
          example: rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE
        routingPlan:
          oneOf:
            - $ref: '#/components/schemas/RoutingPlan'
            - type: 'null'
          description: Embedded only when requested via `expand=routingPlan`.
        currentAttemptId:
          type: [string, 'null']
          description: The attempt currently representing this payment's outcome.
          example: att_01JB8Z44444444444444444444
        attempts:
          type: array
          description: All attempts, oldest first. Failover appends; it never rewrites.
          items:
            $ref: '#/components/schemas/PaymentAttempt'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        statementDescriptor:
          type: string
          maxLength: 22
          description: What the payer sees on their statement.
          example: ACME* ORDER 4471
        metadata:
          type: object
          description: |
            Merchant key-value metadata, echoed on reads. Never inspected, never indexed, and
            never republished in events - only its key names are, because a merchant may put
            their own customer identifiers in the values.
          additionalProperties:
            type: string
            maxLength: 512
          maxProperties: 50
          example:
            orderId: '4471'
        reconciliationRequired:
          type: boolean
          description: |
            True when an attempt ended `TIMEOUT_UNKNOWN` and a reconciler must resolve it. The
            payment stays in `PROCESSING` until it does; no timer may fail it.
          example: false
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Authorization expiry. Drives the auth-expiry sweeper.
          example: '2026-09-02T14:03:11.000Z'
        version:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic aggregate version (invariant I5). Echoed as the `ETag`.
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-08-26T14:03:10.980Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-08-26T14:03:11.412Z'
      example:
        id: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        merchantId: mrc_01JB8Z11111111111111111111
        state: AUTHORIZED
        amount: { amount: 1050, currency: USD }
        authorizedAmount: { amount: 1050, currency: USD }
        capturedAmount: { amount: 0, currency: USD }
        refundedAmount: { amount: 0, currency: USD }
        paymentMethod: CARD
        captureMode: MANUAL
        riskDecision: ALLOW
        riskScore: 12
        threeDsStatus: EXEMPT_LOW_VALUE
        nextAction: null
        routingPlanId: rpl_01JB8ZEEEEEEEEEEEEEEEEEEEE
        currentAttemptId: att_01JB8Z44444444444444444444
        statementDescriptor: ACME* ORDER 4471
        metadata: { orderId: '4471' }
        reconciliationRequired: false
        expiresAt: '2026-09-02T14:03:11.000Z'
        version: 3
        createdAt: '2026-08-26T14:03:10.980Z'
        updatedAt: '2026-08-26T14:03:11.412Z'
        attempts:
          - id: att_01JB8Z44444444444444444444
            attemptNumber: 1
            gatewayId: stripe
            gatewayCode: stripe
            connectionId: gwc_01JB8Z88888888888888888888
            operation: AUTHORIZE
            state: COMPLETED
            outcome: SUCCESS
            gatewayReference: pi_3OqZ4L2eZvKYlo2C
            routingReasons: [PRIMARY_BY_POLICY]
            latencyMs: 412
            configSnapshotAgeMs: 4180
            requestSentAt: '2026-08-26T14:03:11.001Z'
            responseReceivedAt: '2026-08-26T14:03:11.413Z'
        refunds: []
    CreatePaymentRequest:
      type: object
      title: Create payment request
      required: [merchantId, amount, paymentMethod, paymentMethodReference]
      additionalProperties: false
      properties:
        merchantId:
          allOf:
            - $ref: '#/components/schemas/MerchantId'
          description: |
            The merchant on whose behalf the payment is made. Must belong to the token's
            tenant and be `ACTIVE`; anything else is `409 MERCHANT_NOT_ACTIVE`.
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: |
            Minor units and ISO 4217 code. Must be strictly positive, within the merchant's
            configured maximum and in a supported currency.
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentMethodReference:
          $ref: '#/components/schemas/PaymentMethodReference'
        captureMode:
          allOf:
            - $ref: '#/components/schemas/CaptureMode'
          default: AUTOMATIC
          description: |
            `AUTOMATIC` captures on authorization. `MANUAL` leaves the payment `AUTHORIZED`
            until an explicit capture.
        statementDescriptor:
          type: string
          maxLength: 22
          pattern: '^[A-Za-z0-9 *.,\-]{5,22}$'
          description: |
            What the payer sees on their statement. A recognisable descriptor is the cheapest
            chargeback prevention there is.
          example: ACME* ORDER 4471
        payerCountry:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: |
            Payer's country, for risk and routing. Checked against the merchant's `countries`
            and `risk.blockedCountries`.
        reference:
          type: string
          maxLength: 128
          description: |
            The merchant's own order reference. Distinct from the idempotency key: this is
            business data, the key is a protocol concern.
          example: order-4471
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 512
          maxProperties: 50
          description: |
            Arbitrary merchant key-value data, echoed on reads. Do **not** put cardholder
            data, credentials or personal data here - the L1 PAN detector inspects these
            values like every other string.
          example:
            orderId: '4471'
        threeDsPreference:
          type: string
          enum: [AUTOMATIC, FORCE_CHALLENGE, REQUEST_EXEMPTION]
          default: AUTOMATIC
          description: |
            A *request*, not an instruction. The risk policy decides; `FORCE_CHALLENGE` can
            escalate, and `REQUEST_EXEMPTION` is honoured only when the payment actually
            qualifies for one.
          example: AUTOMATIC
        preferredGateway:
          allOf:
            - $ref: '#/components/schemas/GatewayCode'
          description: |
            A routing hint for contractual pinning. Honoured only when the gateway is
            eligible, certified and healthy; otherwise routing proceeds normally and the plan
            records why the preference was not taken.
      example:
        merchantId: mrc_01JB8Z11111111111111111111
        amount: { amount: 1050, currency: USD }
        paymentMethod: CARD
        paymentMethodReference:
          type: GATEWAY_TOKEN
          gatewayCode: stripe
          token: pm_1OqZ4L2eZvKYlo2CqXbTgHkF
          brand: VISA
          last4: '4242'
          expiryMonth: 11
          expiryYear: 2029
        captureMode: MANUAL
        statementDescriptor: ACME* ORDER 4471
        payerCountry: US
        reference: order-4471
        metadata: { orderId: '4471' }
        threeDsPreference: AUTOMATIC
    CaptureRequest:
      type: object
      title: Capture request
      additionalProperties: false
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: |
            Amount to capture. Omit to capture the full remaining authorized amount. Currency
            must equal the payment's currency.
        isFinalCapture:
          type: boolean
          default: true
          description: |
            When `false`, the remaining authorization is kept open for a further partial
            capture, subject to `limits.maxPartialCaptures`. When `true`, any uncaptured
            balance is released.
          example: false
        reference:
          type: string
          maxLength: 128
          description: Merchant reference for this capture, e.g. a shipment identifier.
          example: shipment-1
      example:
        amount: { amount: 600, currency: USD }
        isFinalCapture: false
        reference: shipment-1
    RefundRequest:
      type: object
      title: Refund request
      required: [reason]
      additionalProperties: false
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: |
            Amount to refund. Omit to refund the full remaining refundable balance. Must not
            push the cumulative refunded total above the captured total.
        reason:
          $ref: '#/components/schemas/RefundReason'
        reasonDetail:
          type: string
          maxLength: 512
          description: Free-text detail. Required when `reason` is `OTHER`.
          example: Customer returned item, RMA 88213.
        reference:
          type: string
          maxLength: 128
          example: rma-88213
      example:
        amount: { amount: 300, currency: USD }
        reason: REQUESTED_BY_CUSTOMER
        reasonDetail: Customer returned item, RMA 88213.
        reference: rma-88213
    VoidRequest:
      type: object
      title: Void request
      description: |
        There is no amount: a void always reverses the entire authorization. A partial void is
        not an operation this platform offers.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/VoidReason'
        reasonDetail:
          type: string
          maxLength: 512
          example: Customer canceled before dispatch.
      example:
        reason: MERCHANT_REQUEST
        reasonDetail: Customer canceled before dispatch.
    EventEnvelope:
      type: object
      title: Platform event envelope
      description: |
        CloudEvents 1.0 structural compatibility plus required platform extensions. This is
        the published language across every bounded context and the one shape that must never
        break.

        Events are immutable, versioned in the type name (`.v1`), additive-only within a major
        version, and idempotently consumable - deduplicate on `id`. A breaking change is a new
        `.v2` type published alongside `.v1` until every consumer has migrated, never an
        in-place edit.

        The authoritative definition is `api/events/envelope.schema.json`; per-type `data`
        payload schemas are in `api/events/<type>.schema.json`.
      required:
        - specversion
        - id
        - type
        - source
        - subject
        - time
        - datacontenttype
        - dataschema
        - tenantid
        - correlationid
        - traceparent
        - aggregateid
        - aggregateversion
        - partitionkey
        - data
      additionalProperties: true
      properties:
        specversion:
          type: string
          const: '1.0'
          description: CloudEvents structural version, not our event version.
          example: '1.0'
        id:
          type: string
          pattern: '^evt_[0-9A-Z]{26}$'
          description: |
            Globally unique, time-ordered. **The deduplication key.** A redelivery carries the
            same id and is byte-identical to the first delivery.
          example: evt_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        type:
          type: string
          pattern: '^[a-z_]+\.[a-z_]+\.v[0-9]+$'
          description: '`<aggregate>.<past-tense-verb>.v<major>`.'
          example: payment.authorized.v1
        source:
          type: string
          format: uri-reference
          description: The producing binary. Provenance for incidents, never routing.
          example: /payments-platform/payment-orchestrator
        subject:
          type: string
          description: |
            The aggregate the event is *about*. Usually equals `aggregateid`; differs when an
            event about a child is published under its root.
          example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        time:
          type: string
          format: date-time
          description: |
            When the fact **occurred** in the producer's transaction - not when it was
            published and not when it was consumed. A replayed event carries its original
            time.
          example: '2026-08-26T14:03:11.412Z'
        datacontenttype:
          type: string
          const: application/json
          example: application/json
        dataschema:
          type: string
          format: uri
          description: Resolvable, immutable per version. The artifact the CI compatibility check runs against.
          example: https://schemas.example.com/events/payment.authorized.v1.json
        tenantid:
          allOf:
            - $ref: '#/components/schemas/TenantId'
          description: Present on every event without exception.
        merchantid:
          type: string
          description: |
            Required for every merchant-scoped event; absent only on platform-scoped events
            such as `gateway.health_changed.v1`.
          example: mrc_01JB8Z11111111111111111111
        correlationid:
          type: string
          description: |
            The originating request. Constant across the entire causal fan-out, so one API
            call's full consequences are one query.
          example: req_01JB8Z22222222222222222222
        causationid:
          type: string
          description: |
            The id of the event or command that directly caused this one. Absent on events
            caused by an external API call.
          example: evt_01JB8Z33333333333333333333
        traceparent:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        aggregateid:
          type: string
          description: The aggregate root identifier.
          example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        aggregateversion:
          type: integer
          format: int64
          minimum: 1
          description: |
            The root's version after this change. Monotonic per aggregate but **not dense** -
            a consumer that does not consume every type of an aggregate will see gaps. Use it
            to discard out-of-order and stale redeliveries.
          example: 4
        partitionkey:
          type: string
          description: |
            The Kafka message key, duplicated into the envelope so a consumer reading from an
            archive retains the ordering domain.
          example: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        data:
          type: object
          description: |
            The type-specific payload. Never `null`; an event with no payload carries `{}`.
            Contains no cardholder data, no secrets, no bank account numbers and no principal
            personal data.
      example:
        specversion: '1.0'
        id: evt_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        type: payment.authorized.v1
        source: /payments-platform/payment-orchestrator
        subject: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        time: '2026-08-26T14:03:11.412Z'
        datacontenttype: application/json
        dataschema: https://schemas.example.com/events/payment.authorized.v1.json
        tenantid: ten_01JB8Z00000000000000000000
        merchantid: mrc_01JB8Z11111111111111111111
        correlationid: req_01JB8Z22222222222222222222
        causationid: evt_01JB8Z33333333333333333333
        traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        aggregateid: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        aggregateversion: 4
        partitionkey: pay_01JB8Z9K2QW3E4R5T6Y7V8J9N0
        data:
          attemptId: att_01JB8Z44444444444444444444
          gatewayCode: stripe
          authorizedAmount: { amount: 1050, currency: USD }
          gatewayReference: pi_3OqZ4L2eZvKYlo2C
          authorizationExpiresAt: '2026-09-02T14:03:11.000Z'
          threeDsStatus: AUTHENTICATED
          captureMode: MANUAL
    GatewayWebhookEnvelope:
      type: object
      title: Inbound gateway webhook body
      description: |
        The gateway's own event body, whatever shape that is. This is the one place in the
        platform where a foreign vocabulary is legal, because the anti-corruption layer has
        not run yet. The ingress persists it verbatim and publishes `webhook.received.v1`; the
        translation happens asynchronously.

        The schema is deliberately permissive. Imposing our shape here would reject a valid
        gateway event whenever a gateway added a field, and a rejected webhook means a payment
        that never leaves `PROCESSING`.
      additionalProperties: true
      properties:
        id:
          type: string
          description: The gateway's event identifier. The deduplication key and the partition key.
          example: evt_1Oq9zN4gBxMa
        type:
          type: string
          description: The gateway's own event type string.
          example: payment_intent.succeeded
      example:
        id: evt_1Oq9zN4gBxMa
        type: payment_intent.succeeded
        data:
          object:
            id: pi_3OqZ4L2eZvKYlo2C
            amount: 1050
            currency: usd
            status: succeeded
    WebhookAck:
      type: object
      title: Webhook acknowledgement
      required: [received, duplicate]
      additionalProperties: false
      properties:
        webhookId:
          type: string
          pattern: '^whk_[0-9A-Z]{26}$'
          description: The platform's identifier for this inbound webhook.
          example: whk_01JB8ZJJJJJJJJJJJJJJJJJJJJ
        received:
          type: boolean
          example: true
        duplicate:
          type: boolean
          description: |
            True when this delivery was recognised as one already processed. Answered with a
            success so the gateway stops retrying; a duplicate is normal, not an error.
          example: false
        receivedAt:
          type: string
          format: date-time
          example: '2026-08-26T14:03:12.880Z'
      example:
        webhookId: whk_01JB8ZJJJJJJJJJJJJJJJJJJJJ
        received: true
        duplicate: false
        receivedAt: '2026-08-26T14:03:12.880Z'
    HealthStatus:
      type: object
      title: Health status
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          example: ok
        service:
          type: string
          description: The deployable answering the probe.
          example: payment-api
        version:
          type: string
          description: Build version of the running binary.
          example: 1.14.2
        region:
          type: string
          example: eu-central-1
        checks:
          type: array
          description: |
            Per-dependency detail. Present on `/readyz` only - `/healthz` and `/livez`
            deliberately check nothing a restart cannot fix.
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name:
                type: string
                example: postgres-writer
              status:
                type: string
                enum: [ok, degraded, unavailable]
                example: ok
              detail:
                type: string
                maxLength: 512
                example: Round-trip 3 ms.
              latencyMs:
                type: integer
                format: int32
                minimum: 0
                example: 3
        configSnapshotAgeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Age of the last-known-good configuration snapshot. Alerts past 5 minutes; past
            `max_config_staleness` the data plane fails closed for new merchants while
            continuing to serve existing ones.
          example: 4
      example:
        status: ok
        service: payment-api
        version: 1.14.2
        region: eu-central-1
        configSnapshotAgeSeconds: 4
        checks:
          - name: postgres-writer
            status: ok
            latencyMs: 3
          - name: outbox
            status: ok
            latencyMs: 1
